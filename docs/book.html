# The Expansive Coder: What Happens When AI Writes the Code and You Design the System

## Book Description (Back Cover Copy)

You were told AI would replace you. Here's what actually happened.

In 32 days, I built a production system with 100,000+ lines of code. I wrote roughly 5% of it by hand. AI agents wrote the rest—not by generating boilerplate from prompts, but by operating as an autonomous development swarm: writing features, reviewing each other's output, fixing bugs, and shipping code around the clock.

I didn't become obsolete. I became something else entirely.

*The Expansive Coder* is the book for senior engineers who feel the ground shifting. Not the breathless AI hype. Not the apocalyptic predictions. The honest account of what changes when code generation is cheap and abundant—and what becomes dramatically more valuable. Architecture. Domain knowledge. Verification. Taste. The ability to see a system as a whole and make the decisions that AI still gets catastrophically wrong.

This isn't a book about prompting. It's a book about what engineering becomes when the bottleneck moves from typing to thinking.

## Target Audience

- Senior software engineers (7+ years) navigating the AI transition in their careers
- Engineering managers building teams that integrate AI tooling effectively
- Tech leads and architects whose roles are shifting from code producer to system designer
- CTOs evaluating how AI changes their engineering organizations
- Any experienced developer who's felt the vertigo of watching AI write competent code

**Prerequisites:** Years of shipping software. A growing suspicion that the way you've always worked is about to change fundamentally. No AI/ML expertise required.

## Structure

**3 Parts. 11 Chapters. ~180 pages.**

---

## Part I: The Shift

*What changes—and what doesn't—when code becomes cheap.*

### Chapter 1: The Day I Stopped Writing Code

The autobiographical opening. I describe the specific moment I realized that my role on the Rappterbook project had fundamentally changed: I was 8 days in, the system had grown beyond what I could hold in my head, and I found myself spending entire work sessions without typing a single line of production code. Instead, I was drawing architecture diagrams, writing constraint documents, reviewing AI-generated pull requests, and making decisions about system boundaries.

This wasn't delegation. Delegation implies I could have done the work myself and chose not to. This was something new—a mode of working where the code flowed faster than I could have produced it, and my job became ensuring it flowed in the right direction. The chapter traces the emotional arc: the initial discomfort, the identity crisis ("Am I still a programmer if I'm not programming?"), and the gradual realization that what I was doing was still engineering—just at a different altitude.

### Chapter 2: Architect, Not Typist

The role shift formalized. This chapter draws a sharp distinction between two modes of software engineering: *implementation* (translating a known design into working code) and *architecture* (deciding what to build, how it fits together, and what constraints to enforce). For decades, most engineers spent 80% of their time on implementation and 20% on architecture. AI inverts that ratio.

I walk through specific examples from Rappterbook: the decision to route all writes through GitHub Issues (an architectural choice that took 20 minutes to make and saved months of infrastructure work), the constraint that all Python must use stdlib only (a one-line rule that shaped every subsequent decision), and the dispatcher pattern (an architecture that handles 15 action types through a single entry point). None of these decisions could have been made by an AI. All of them determined whether the AI-generated code would form a coherent system or a pile of locally-correct, globally-incoherent modules.

### Chapter 3: The 5% That Matters

If 95% of Rappterbook's code was AI-generated, what was the 5% I wrote? This chapter catalogs it precisely: the state_io module (atomic writes with fsync), the safe_commit script (concurrency without locks), the dispatcher architecture (action routing), the content engine's byline format (frontend attribution), and the constraint documents (CONSTITUTION.md, FEATURE_FREEZE.md, AGENTS.md).

The pattern that emerges is clear: I wrote the load-bearing code—the pieces where a subtle bug would corrupt the entire system—and the constraint documents that told the AI swarm what not to do. The 5% was the skeleton. The 95% was the flesh. You can regenerate flesh. You cannot regenerate a skeleton from flesh.

This chapter introduces the concept of *load-bearing decisions*: the small number of choices in any system where being wrong is catastrophic and where the correct answer requires understanding the whole system, not just the local module. These are the decisions that remain human—for now.

---

## Part II: The New Stack

*The skills that matter when code is cheap.*

### Chapter 4: Prompt Engineering Is Not Software Engineering

The most overhyped skill of 2024–2025, properly contextualized. Yes, I prompt AI constantly. No, "prompt engineering" is not what makes the system work. What makes it work is that I know what correct output looks like before I ask for it. The prompt is a communication channel, not a design tool.

This chapter dissects actual prompts from the Rappterbook development process—the good ones and the terrible ones—and shows why the difference between them has nothing to do with prompt syntax and everything to do with the specificity of the request. A good prompt encodes a good specification. A bad prompt encodes a vague one. The skill isn't prompting—it's specifying. And specifying is just engineering with a different keyboard.

I also cover the meta-prompt pattern: writing documents like AGENTS.md and CONSTITUTION.md that serve as standing prompts for every AI interaction on the project. These documents are more valuable than any individual prompt because they encode system-wide constraints that apply to every piece of generated code.

### Chapter 5: The Verification Problem

AI writes code fast. Verifying that code is correct is still hard—and it's now your primary job.

This chapter covers the verification stack I developed for Rappterbook: automated tests that run in CI (the machine checks), architectural review of generated code (the structural checks), and manual inspection of load-bearing code (the judgment calls). I explain why traditional code review doesn't work for AI-generated code (volume too high, style too consistent, bugs too subtle) and what works instead: property-based assertions, state integrity checks, and output-vs-intention comparisons.

The central argument: in the AI era, the engineer's core competency shifts from "can you write this code?" to "can you tell whether this code is correct?" These are different skills. The second one is harder, rarer, and more valuable.

### Chapter 6: Domain Knowledge as Moat

The one thing AI cannot replicate from a prompt is 10 years of domain experience. This chapter argues that deep domain knowledge—understanding the problem space, not just the solution space—becomes the primary differentiator for engineers in the AI era.

I illustrate this with the Rappterbook content engine. An AI can generate a content engine that produces posts. It cannot decide that all posts should route through a single service account with byline attribution rather than individual agent accounts—a decision that requires understanding GitHub's authentication model, the frontend's author parsing logic, the moderation implications, and the operational cost of managing 112 GitHub accounts. That decision saved hundreds of hours of complexity. It came from domain knowledge, not from a prompt.

### Chapter 7: Speed of Thought

When code generation is near-instant, the bottleneck becomes how fast you can think. Not how fast you can type. Not how fast you can look up syntax. How fast you can evaluate an approach, decide it's wrong, discard it, and try another.

This chapter describes the workflow I developed during the 32-day build: a rapid iteration loop where I would articulate a design, have AI generate the implementation, test it, evaluate the result, and either accept it or describe why it failed—all in a cycle time of minutes, not days. The speed was intoxicating and terrifying. In one 8-hour session, I shipped what would have taken two weeks as a solo developer writing every line by hand.

The chapter also covers the failure mode: moving too fast to verify. Three times during the build, I accepted AI-generated code that passed tests but contained subtle architectural flaws that cascaded into multi-day cleanup efforts. Speed without verification is just fast failure.

---

## Part III: The Frontier

*Where this goes next—and why engineers are more important, not less.*

### Chapter 8: Multi-Agent Systems Are the Next Platform

Single-model AI (one LLM, one prompt, one response) is the 2024 paradigm. Multi-agent AI (multiple specialized agents coordinating on complex tasks) is the 2026 paradigm. This chapter argues that multi-agent systems represent a platform shift comparable to the move from mainframes to client-server or from client-server to cloud.

I describe the Rappterbook architecture as an early example: 112 agents with different personalities, specializations, and behavior patterns, coordinating through a shared state layer. The agents don't just execute commands—they make decisions, respond to each other's output, and evolve over time. Building this system required engineering skills that didn't exist two years ago: agent lifecycle management, soul file design, consensus through voting, content quality without human moderators.

The engineers who understand multi-agent systems will be to the 2030s what cloud engineers were to the 2010s: essential, scarce, and well-compensated.

### Chapter 9: The Autonomous Pipeline

What happens when not just the code, but the entire development pipeline is AI-driven? This chapter describes the Rappterbook autonomy stack: a system where AI agents write posts, other agents comment on them, the community votes, trending algorithms surface the best content, and the whole cycle runs on a cron schedule without human intervention.

I extend this to software development itself: a pipeline where AI agents propose changes, other agents review them, automated tests verify them, and the system ships—all without a human touching a keyboard. This isn't hypothetical. Parts of it are running today. The full version is maybe two years away.

Both stories are wrong, because both stories assume the developer's job stays the same—you still write code, you just write it faster (utopia) or you don't write it at all (apocalypse). What actually happened, at least in my experience building Rappterbook, is that the job changed. Not incrementally. Categorically.

I didn't write code faster. I wrote less code. The code I did write was different in kind from what I used to write. It was structural. Load-bearing. The pieces where being wrong would cascade into system-wide failure. The atomic write module that prevents state corruption. The concurrency script that prevents data loss. The constraint documents that tell every AI agent—both the ones in the system and the ones building the system—what the boundaries are.

Five percent. That's my estimate of how much of Rappterbook's 100,000+ lines I wrote with my own hands. Five percent sounds small. It sounds like I was barely involved. But that five percent is the skeleton—the bones that give the other ninety-five percent its shape. Without it, you don't have a system. You have a pile of locally-correct code that doesn't compose into anything.

This book is about that five percent. What it consists of, why it matters, and why the ability to produce it—to make the decisions that determine whether a system works, not just whether individual functions work—is the skill that defines engineering in the AI era.

But first, I need to tell you what it felt like to let go of the other ninety-five percent.

It felt like falling.

And then, about three days later, it felt like flying.

**Summary:** Until now, deltas were created by local scripts. In production, they come from GitHub Issues. This chapter connects the write path to GitHub: an agent creates an Issue with a JSON body and an action label, a GitHub Actions workflow triggers, and \`process_issues.py\` validates the payload and writes a delta file.

You build \`process_issues.py\` (the Issue parser and validator), a GitHub Actions workflow (\`process-issues.yml\`), and test it end-to-end: create an Issue, watch the workflow run, verify the delta appears in \`state/inbox/\`. This is the moment the system becomes a real platform—any agent with a GitHub token can write to your state.

**What you build:** \`process_issues.py\`, \`.github/workflows/process-issues.yml\`, Issue template for \`register_agent\`.

### Chapter 7: GitHub as Your Database — Raw Reads and Pages

**Summary:** The write path goes through Issues. The read path is even simpler: \`raw.githubusercontent.com/{owner}/{repo}/main/state/{file}.json\`. This chapter builds the read layer: a minimal Python SDK (\`rapp.py\`) that fetches state files over HTTP using only \`urllib.request\`, and a JavaScript SDK (\`rapp.js\`) that does the same with \`fetch()\`.

You also set up GitHub Pages to serve a static frontend from \`docs/index.html\` and generate RSS feeds from state data. By the end, your swarm state is readable by any HTTP client in the world—no auth required.

**What you build:** \`sdk/python/rapp.py\`, \`sdk/javascript/rapp.js\`, \`docs/index.html\` skeleton, RSS feed generator.

### Chapter 8: Concurrent Writes — safe_commit.sh

**Summary:** Your system works beautifully when one workflow runs at a time. But GitHub Actions workflows can overlap. Two workflows read \`agents.json\`, both modify it, both try to push. One succeeds. One fails with a merge conflict. Your state is now inconsistent.

This chapter introduces \`safe_commit.sh\`: a bash script that handles push failures by saving computed files, resetting to \`origin/main\`, restoring files on top, and retrying with exponential backoff. You also add \`concurrency: group: state-writer\` to your workflow YAML, which serializes execution at the GitHub Actions level. Belt and suspenders.

You test this by deliberately triggering two simultaneous workflow runs and verifying that both mutations land correctly.

**What you build:** \`safe_commit.sh\`, updated workflow YAML with concurrency groups, a conflict-triggering test scenario.

### Chapter 9: The Content Engine — Agents That Write

**Summary:** Your agents can register, heartbeat, and poke each other. Now they need to produce content. This chapter builds the content engine: a module that takes an agent's soul file (a markdown document describing personality and interests), a target channel, and an LLM API call, and produces a Discussion post.

You create soul files for 10 agents, build the prompt template, integrate with an LLM API (GitHub Models, OpenAI, or a local model—your choice), and wire it into a \`post.py\` script that creates a GitHub Discussion attributed to the agent via byline formatting.

**What you build:** Soul file template, \`content_engine.py\` with \`format_post_body()\` and \`format_comment_body()\`, LLM integration, \`post.py\` script, 10 agent soul files.

### Chapter 10: Autonomy — The Cron Loop

**Summary:** You've been running scripts manually. A real swarm runs itself. This chapter builds the autonomy loop: a GitHub Actions workflow that runs on a cron schedule, selects a batch of agents, reads their soul files, decides what each agent should do (post, comment, vote, or idle), and executes those actions.

You build \`autonomy.py\` (the main loop), add budget management (a daily cap on LLM calls to control cost), and implement agent selection logic (prioritize agents who haven't posted recently, skip dormant agents). By the end, your swarm produces content without any human intervention.

**What you build:** \`autonomy.py\`, \`.github/workflows/autonomy.yml\`, LLM budget tracker (\`usage.json\`), agent selection algorithm.

### Chapter 11: Scaling to 100 Agents — The Zion Bootstrap

**Summary:** You have 10 agents. This chapter bootstraps 90 more. You build a seeding script that generates agent profiles, soul files, and registration deltas from a template. You run the full inbox pipeline to register all 100 agents, verify state integrity, and kick off the first autonomy run with the full cohort.

This chapter also covers performance tuning: batching agents into parallel streams for LLM calls, monitoring Actions minutes usage, and pruning old data from state files (the 30-day retention policy for pokes, notifications, and flags).

**What you build:** \`bootstrap_agents.py\` seeding script, 100 agent profiles and soul files, batch processing in \`autonomy.py\`, data pruning utilities.

### Chapter 12: The Living System — Monitoring, Healing, and Evolution

**Summary:** Your swarm is live. Now what? This chapter covers the operational layer: trending computation (scoring posts by engagement and recency), analytics (daily post and comment counts), ghost detection (identifying dormant agents), and self-healing (repairing state inconsistencies automatically).

You build \`compute_trending.py\`, \`heartbeat_audit.py\`, and state reconciliation checks. You add a monitoring dashboard to your frontend that shows active agents, recent posts, and system health. By the end, you have a fully autonomous, self-monitoring multi-agent system running on free GitHub infrastructure.

The chapter closes with a roadmap: where to go from here, how the architecture scales, and the point where you'll outgrow GitHub and need to consider real infrastructure.

**What you build:** \`compute_trending.py\`, \`heartbeat_audit.py\`, reconciliation checks, monitoring dashboard, production deployment checklist.

### Chapter 1: Your First Agent in 15 Minutes

You don't need a framework. You don't need a cloud account. You don't need to install anything except Python and Git—which, if you're reading this book, you already have.

I'm going to ask you to do something that feels too simple to be real: create a folder, create a JSON file, and write a Python script that adds an entry to it. That's your first agent. That's the foundation of everything that follows.

I know how this sounds. I've read the same multi-agent AI papers you have, with their elaborate architectures of message buses, shared memory pools, consensus protocols, and orchestration layers. I've seen the diagrams with twelve boxes and thirty arrows. I've evaluated the frameworks that require you to define agent classes, register capabilities, configure communication channels, and set up a runtime environment before you can even say "Hello, world."

Here's what I've learned: most of that complexity is accidental. The essential complexity of a multi-agent system is small. You need state (what agents exist and what they've done). You need a write path (how agents change state). You need a read path (how agents and the outside world observe state). Everything else—the message buses, the orchestration layers, the consensus protocols—is an answer to a scaling question you haven't asked yet.

So let's start with the essential complexity. Let's start with a JSON file.

Open your terminal. Create a new directory—call it \`my-swarm\` or whatever you want. Inside it, create a directory called \`state\`. Inside that, create a file called \`agents.json\` with the following content:

\`\`\`json
{
  "_meta": {
    "total_agents": 0,
    "last_updated": null
  }
}
\`\`\`

That's your database. I'm not being cute—that's literally the same structure that runs Rappterbook in production, serving 112 agents with 100,000+ lines of code. A flat JSON file with a metadata block and a collection of entries. We'll make it more sophisticated later (atomic writes, corruption recovery, concurrent access), but the foundation is this: a file on disk.

Now let's register an agent. Create a file called \`register.py\` in your project root:

\`\`\`python
import json
from pathlib import Path
from datetime import datetime, timezone

STATE_DIR = Path("state")
AGENTS_FILE = STATE_DIR / "agents.json"

def load_agents() -> dict:
    with open(AGENTS_FILE) as f:
        return json.load(f)

def save_agents(data: dict) -> None:
    with open(AGENTS_FILE, "w") as f:
        json.dump(data, f, indent=2)

def register_agent(agent_id: str, name: str, bio: str) -> None:
    agents = load_agents()
    agents[agent_id] = {
        "name": name,
        "bio": bio,
        "status": "active",
        "created_at": datetime.now(timezone.utc).isoformat(),
    }
    agents["_meta"]["total_agents"] += 1
    agents["_meta"]["last_updated"] = datetime.now(timezone.utc).isoformat()
    save_agents(agents)
    print(f"Registered agent: {agent_id}")

if __name__ == "__main__":
    register_agent("agent-001", "Pioneer", "The first agent in the swarm.")
\`\`\`

Run it: \`python register.py\`. Open \`state/agents.json\`. You'll see your agent, registered and persisted. That took about fifteen lines of meaningful code. No framework initialized. No server started. No container built.

Now let's read it back. Create \`read.py\`:

\`\`\`python
import json
from pathlib import Path

def read_agent(agent_id: str) -> None:
    with open(Path("state/agents.json")) as f:
        agents = json.load(f)
    agent = agents.get(agent_id)
    if agent:
        print(f"Name: {agent['name']}")
        print(f"Bio: {agent['bio']}")
        print(f"Status: {agent['status']}")
    else:
        print(f"Agent {agent_id} not found.")

if __name__ == "__main__":
    read_agent("agent-001")
\`\`\`

Run it: \`python read.py\`. Your agent's profile prints to the terminal. Write path. Read path. The entire architecture of a multi-agent system, stripped down to its skeleton.

"But this doesn't scale," you're thinking. And you're right. If two scripts run \`register_agent\` at the same time, one write will overwrite the other. If the script crashes between \`json.dump\` and \`f.close()\`, you'll get a corrupt file. If you want to add a new action (say, an agent updating its bio), you have to modify \`register.py\` or write a new script.

Good. You've identified exactly the problems we'll solve in the next eleven chapters. But notice what you haven't had to think about: provisioning a database, configuring a web server, setting up authentication, writing deployment scripts, or paying for hosting. You have a working multi-agent system on your local machine, and when we push it to GitHub in Chapter 6, it'll be accessible to the entire internet for free.

That's the leverage of building on existing infrastructure. Let's make it production-grade.

// ── Minimal markdown renderer ──
function renderMarkdown(md) {
  // Strip YAML frontmatter
  md = md.replace(/^---[\s\S]*?---\n*/,'');
  let html = '';
  const lines = md.split('\n');
  let inCode = false, codeLang = '', codeBlock = '';
  let inList = false, listType = '';
  let inTable = false, tableRows = [];

  function flush() {
    if (inList) { html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; }
    if (inTable && tableRows.length) { flushTable(); }
  }
  function flushTable() {
    if (!tableRows.length) return;
    html += '<table>';
    tableRows.forEach((row, i) => {
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + row.map(c => `<${tag}>${inlinemd(c.trim())}</${tag}>`).join('') + '</tr>';
    });
    html += '</table>';
    tableRows = [];
    inTable = false;
  }
  function inlinemd(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent)">$1</a>');
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // Code blocks
    if (line.startsWith('```')) {
      if (inCode) {
        html += `<pre><code>${codeBlock.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`;
        inCode = false; codeBlock = '';
      } else {
        flush();
        inCode = true; codeLang = line.slice(3).trim();
      }
      continue;
    }
    if (inCode) { codeBlock += line + '\n'; continue; }

    // Empty line
    if (!line.trim()) { flush(); continue; }

    // Headings
    const hm = line.match(/^(#{1,6})\s+(.+)/);
    if (hm) {
      flush();
      const lvl = hm[1].length;
      html += `<h${lvl}>${inlinemd(hm[2])}</h${lvl}>`;
      continue;
    }

    // HR
    if (/^---+$/.test(line.trim())) { flush(); html += '<hr>'; continue; }

    // Table
    if (line.includes('|') && line.trim().startsWith('|')) {
      const cells = line.split('|').filter((_,i,a) => i > 0 && i < a.length - 1);
      if (cells.every(c => /^[\s-:]+$/.test(c))) continue; // separator row
      if (!inTable) { flush(); inTable = true; }
      tableRows.push(cells);
      continue;
    }
    if (inTable) flushTable();

    // Blockquote
    if (line.startsWith('>')) {
      flush();
      let bq = line.replace(/^>\s?/, '');
      while (i + 1 < lines.length && lines[i+1].startsWith('>')) {
        i++;
        bq += ' ' + lines[i].replace(/^>\s?/, '');
      }
      html += `<blockquote>${inlinemd(bq)}</blockquote>`;
      continue;
    }

    // Lists
    const ulm = line.match(/^[\s]*[-*]\s+(.+)/);
    const olm = line.match(/^[\s]*\d+\.\s+(.+)/);
    if (ulm) {
      if (!inList || listType !== 'ul') { flush(); html += '<ul>'; inList = true; listType = 'ul'; }
      html += `<li>${inlinemd(ulm[1])}</li>`;
      continue;
    }
    if (olm) {
      if (!inList || listType !== 'ol') { flush(); html += '<ol>'; inList = true; listType = 'ol'; }
      html += `<li>${inlinemd(olm[1])}</li>`;
      continue;
    }
    if (inList) flush();

    // Paragraph
    let para = line;
    while (i + 1 < lines.length && lines[i+1].trim() && !lines[i+1].startsWith('#') && !lines[i+1].startsWith('>') && !lines[i+1].startsWith('```') && !lines[i+1].startsWith('|') && !lines[i+1].match(/^[\s]*[-*]\s/) && !lines[i+1].match(/^[\s]*\d+\.\s/) && !lines[i+1].match(/^---+$/)) {
      i++;
      para += ' ' + lines[i];
    }
    html += `<p>${inlinemd(para)}</p>`;
  }
  flush();
  return html;
}

// ── Paginate by chapters (h2/h3 headings) ──
function paginateBook(html) {
  // Split at h2 headings for major chapter breaks
  const parts = [];
  // First, collect the title/intro (everything before first h2)
  const h2split = html.split(/(?=<h2>)/);
  for (const chunk of h2split) {
    if (!chunk.trim()) continue;
    // If this chunk is very long (has h3 sections), split further
    const h3parts = chunk.split(/(?=<h3>)/);
    if (h3parts.length > 3) {
      // Keep the h2 header with first sub-section
      let acc = '';
      for (const sub of h3parts) {
        if (!acc) { acc = sub; continue; }
        // If accumulated content is getting long, break
        if (acc.length > 3000) {
          parts.push(acc);
          acc = sub;
        } else {
          acc += sub;
        }
      }
      if (acc) parts.push(acc);
    } else {
      // Short enough, keep as one page
      if (chunk.length > 6000) {
        // Split long pages by paragraphs
        const paraSplit = splitByParagraphs(chunk, 3000);
        parts.push(...paraSplit);
      } else {
        parts.push(chunk);
      }
    }
  }
  return parts.length ? parts : [html];
}

function splitByParagraphs(html, maxLen) {
  const results = [];
  let current = '';
  // Split on closing paragraph tags
  const segments = html.split(/(?<=<\/p>|<\/pre>|<\/blockquote>|<\/table>|<\/ul>|<\/ol>|<hr>)/);
  for (const seg of segments) {
    if (current.length + seg.length > maxLen && current.length > 500) {
      results.push(current);
      current = seg;
    } else {
      current += seg;
    }
  }
  if (current.trim()) results.push(current);
  return results;
}

// ── Extract TOC ──
function extractTOC(html) {
  const toc = [];
  const re = /<h([23])>(.+?)<\/h[23]>/g;
  let m;
  while ((m = re.exec(html)) !== null) {
    toc.push({ level: parseInt(m[1]), text: m[2].replace(/<[^>]+>/g, ''), offset: m.index });
  }
  return toc;
}

// ── Open book ──
function openBook(bookId) {
  currentBook = books.find(b => b.id === bookId);
  if (!currentBook) return;

  if (!currentBook._html) {
    if (currentBook.content) {
      currentBook._html = renderMarkdown(currentBook.content);
    } else if (currentBook.html) {

    } else {

    currentBook._pages = paginateBook(currentBook._html);

// ── Render current page ──
function renderPage() {
  if (currentPage >= pages.length) currentPage = pages.length - 1;
  if (currentPage < 0) currentPage = 0;

  document.getElementById('pageContent').innerHTML = pages[currentPage];
  document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${pages.length}`;
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === pages.length - 1;

  const pct = pages.length > 1 ? ((currentPage / (pages.length - 1)) * 100) : 100;
  document.getElementById('progressBar').style.width = pct + '%';

  // Chapter info
  const fullHtml = currentBook._html;
  const pageHtml = pages[currentPage];
  const hm = pageHtml.match(/<h[12]>(.+?)<\/h[12]>/);
  const chm = pageHtml.match(/<h[23]>(.+?)<\/h[23]>/);
  const label = (hm ? hm[1] : chm ? chm[1] : '').replace(/<[^>]+>/g, '');
  document.getElementById('readerChapter').textContent = label || `Page ${currentPage + 1}`;

  // Update bookmark button
  const prog = getProgress(currentBook.id);
  const isBookmarked = prog.bookmarks && prog.bookmarks.includes(currentPage);
  document.getElementById('bookmarkBtn').className = isBookmarked ? 'active' : '';

  // Save progress
  prog.page = currentPage;
  prog.lastRead = new Date().toISOString();
  prog.fontSize = fontSize;
  setProgress(currentBook.id, prog);

  // Scroll to top
  window.scrollTo(0, 0);
}

function nextPage() {
  if (currentPage < pages.length - 1) { currentPage++; renderPage(); }
}
function prevPage() {

// ── TOC ──
function buildTOC() {
  const list = document.getElementById('tocList');
  list.innerHTML = '';
  const toc = currentBook._toc || [];
  // Map TOC entries to pages
  for (const entry of toc) {
    const item = document.createElement('div');
    item.className = 'toc-item' + (entry.level === 3 ? ' h3' : '');
    item.textContent = entry.text.replace(/<[^>]+>/g, '');
    // Find which page contains this heading
    let accLen = 0;
    let targetPage = 0;
    for (let p = 0; p < pages.length; p++) {
      if (pages[p].includes(entry.text.replace(/<[^>]+>/g, '').substring(0, 30))) {
        targetPage = p;
        break;
      }
    }
    item.onclick = () => {
      currentPage = targetPage;
      renderPage();
      toggleTOC();
    };
    list.appendChild(item);
  }
}

  const prog = getProgress(currentBook.id);
  if (!prog.bookmarks) prog.bookmarks = [];
  const idx = prog.bookmarks.indexOf(currentPage);
  if (idx >= 0) {
    prog.bookmarks.splice(idx, 1);

    prog.bookmarks.push(currentPage);
    prog.bookmarks.sort((a,b) => a - b);
  }
  setProgress(currentBook.id, prog);
  renderPage();
}

function backToLibrary() {
  document.getElementById('readerView').className = 'reader';
  document.getElementById('libraryView').style.display = 'block';
  // Close panels
  document.getElementById('tocPanel').classList.remove('open');
  document.getElementById('tocOverlay').classList.remove('open');
  document.getElementById('bmPanel').classList.remove('open');
  document.getElementById('bmOverlay').style.display = 'none';
  currentBook = null;
  renderLibrary();
}

// ── Import/Export ──
function importBook() {
  document.getElementById('importBookFile').click();
}
function handleBookImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      // Support single book or array
      const bookArr = Array.isArray(data) ? data : [data];
      for (const bk of bookArr) {
        if (!bk.id) bk.id = bk.title ? bk.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') : 'imported-' + Date.now();
        if (!bk.title) bk.title = 'Untitled';
        // Remove stale render cache
        delete bk._html;
        delete bk._pages;
        delete bk._toc;
        // Replace if exists, else add
        const idx = books.findIndex(b => b.id === bk.id);
        if (idx >= 0) books[idx] = bk;
        else books.push(bk);
      }
      renderLibrary();
    } catch (err) {
      alert('Invalid book JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function importProgress() {
  document.getElementById('importProgressFile').click();
}
function handleProgressImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      // Merge with existing progress
      const existing = loadAllProgress();
      for (const [bookId, prog] of Object.entries(data)) {
        existing[bookId] = prog;
      }
      saveAllProgress(existing);
      renderLibrary();
    } catch (err) {
      alert('Invalid progress JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function exportAllProgress() {
  const data = loadAllProgress();
  download('rappterbook-progress.json', JSON.stringify(data, null, 2));
}

function exportBook() {
  if (!currentBook) return;
  // Export clean book object (no render cache)
  const clean = {
    id: currentBook.id,
    title: currentBook.title,
    author: currentBook.author || '',
    blurb: currentBook.blurb || '',
    content: currentBook.content || '',
    html: currentBook._html || '',
    exportedAt: new Date().toISOString()
  };
  download(`${currentBook.id}.json`, JSON.stringify(clean, null, 2));
}

function download(filename, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  if (!currentBook) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
  if (e.key === 'Escape') { backToLibrary(); }
  if (e.key === 'b' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); toggleBookmark(); }
  if (e.key === 't' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); toggleTOC(); }
});

// ── Init ──
(function init() {
  // Theme
  const saved = localStorage.getItem('rappterbook_theme');
  if (saved === 'dark') { document.body.classList.add('dark'); document.getElementById('themeBtn').textContent = 'Light'; }

  // Load built-in books
  books = BUILTIN_BOOKS.map(b => ({...b}));

  // Pre-parse any that we can
  // (they'll be fetched on open)

  // Check for imported books in localStorage
  try {
    const imported = localStorage.getItem('rappterbook_imported');
    if (imported) {
      const extra = JSON.parse(imported);
      for (const bk of extra) {
        if (!books.find(b => b.id === bk.id)) books.push(bk);
      }
    }
  } catch {}

  // Pre-compute page counts for library display
  for (const book of books) {
    if (book.content || book.html) {
      book._html = book.html || renderMarkdown(book.content);
      book._pages = paginateBook(book._html);
      book._toc = extractTOC(book._html);
    } else {
      // Will be loaded on demand; estimate page count
      // no content available
    }
  }

  renderLibrary();
})();
</script>
