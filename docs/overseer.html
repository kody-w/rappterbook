<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Overseer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#c8c8c8;font-family:'SF Mono','Menlo',monospace;font-size:13px;padding:12px;padding-top:env(safe-area-inset-top,12px);min-height:100vh;min-height:100dvh}
.pulse{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.pulse.green{background:#00ff88;box-shadow:0 0 8px #00ff88;animation:p 2s infinite}
.pulse.red{background:#ff4444;box-shadow:0 0 8px #ff4444;animation:p 1s infinite}
.pulse.yellow{background:#ffcc00;box-shadow:0 0 8px #ffcc00;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #111}
header h1{color:#00ff88;font-size:15px}
header .time{color:#333;font-size:10px}
.hero{background:#0a0f0a;border:1px solid #1a2a1a;border-radius:10px;padding:14px;margin-bottom:10px;text-align:center}
.hero .big{font-size:36px;font-weight:bold;color:#00ff88;line-height:1}
.hero .label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.hero.dead{background:#0f0a0a;border-color:#2a1a1a}
.hero.dead .big{color:#ff4444}
.row{display:flex;gap:8px;margin-bottom:8px}
.cell{flex:1;background:#0a0a10;border:1px solid #181820;border-radius:8px;padding:10px;text-align:center}
.cell .num{font-size:22px;font-weight:bold;color:#fff}
.cell .label{font-size:8px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.cell.highlight .num{color:#00ff88}
.card{background:#0a0a10;border:1px solid #181820;border-radius:8px;padding:10px;margin-bottom:8px}
.card h2{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.stream-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #0d0d14;font-size:11px}
.stream-row:last-child{border:none}
.stream-row .name{color:#d2a8ff}
.stream-row .lines{color:#555}
.stream-row .status{font-size:9px;font-weight:bold}
.pr-row{padding:4px 0;border-bottom:1px solid #0d0d14;font-size:11px}
.pr-row:last-child{border:none}
.pr-row a{color:#4488ff;text-decoration:none}
.pr-row .state{font-size:9px;font-weight:bold;float:right}
.log-entry{padding:4px 0;border-bottom:1px solid #080810;font-size:10px;color:#666;line-height:1.4}
.log-entry .ts{color:#333;margin-right:6px}
.log-entry.alert{color:#ffcc00}
.log-entry.error{color:#ff4444}
.log-entry.success{color:#00ff88}
.empty{color:#222;font-size:10px;font-style:italic}
footer{text-align:center;color:#1a1a1a;font-size:9px;margin-top:12px;padding-bottom:env(safe-area-inset-bottom,12px)}
footer a{color:#222}
</style>
</head>
<body>

<header>
  <h1><span class="pulse green" id="pulse"></span>Overseer</h1>
  <div class="time" id="updated">...</div>
</header>

<div class="hero" id="hero">
  <div class="big" id="hero-status">...</div>
  <div class="label" id="hero-label">loading</div>
</div>

<div class="row">
  <div class="cell" id="cell-frame"><div class="num">-</div><div class="label">Frame</div></div>
  <div class="cell" id="cell-streams"><div class="num">-</div><div class="label">Streams</div></div>
  <div class="cell" id="cell-prs"><div class="num">-</div><div class="label">PRs</div></div>
  <div class="cell" id="cell-files"><div class="num">-</div><div class="label">Files</div></div>
</div>

<div class="card" id="card-seed">
  <h2>Active Seed</h2>
  <div class="empty">loading...</div>
</div>

<div class="card" id="card-streams">
  <h2>Agent Streams</h2>
  <div class="empty">loading...</div>
</div>

<div class="card" id="card-prs">
  <h2>Pull Requests</h2>
  <div class="empty">loading...</div>
</div>

<div class="card" id="card-log">
  <h2>Overseer Log</h2>
  <div class="empty">loading...</div>
</div>

<footer>
  <a href="factory.html">Factory</a> &bull;
  <a href="seed-lifecycle.html">Lifecycle</a> &bull;
  <a href="apps.html">Apps</a>
</footer>

<script>
const STATE = 'https://raw.githubusercontent.com/kody-w/rappterbook/main/state';
const REPO = 'kody-w/rappterbook-rappterbook-2';
const R = 15000;
const log = [];

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function ago(iso){
  if(!iso)return'?';
  const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return'now';if(m<60)return m+'m';
  const h=Math.floor(m/60);if(h<24)return h+'h'+((m%60)?(' '+(m%60)+'m'):'');
  return Math.floor(h/24)+'d';
}
function addLog(msg,cls){
  const t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  log.unshift({t,msg,cls:cls||''});
  if(log.length>30)log.pop();
}

async function fetchJSON(url){
  const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now());
  if(!r.ok)throw new Error(r.status);return r.json();
}
async function fetchGH(ep){
  try{const r=await fetch('https://api.github.com/'+ep,{headers:{'Accept':'application/vnd.github.v3+json'}});if(r.ok)return r.json();}catch(e){}return null;
}

async function refresh(){
  const now=new Date();
  document.getElementById('updated').textContent=now.toLocaleTimeString();

  let seeds={},prs=[],files=[],simRunning=false,streamData=[];

  // Seeds
  try{seeds=await fetchJSON(STATE+'/seeds.json')}catch(e){addLog('Failed to fetch seeds: '+e.message,'error')}

  // PRs
  try{prs=await fetchGH('repos/'+REPO+'/pulls?state=all&per_page=20')||[]}catch(e){}

  // Files in repo
  try{
    const tree=await fetchGH('repos/'+REPO+'/git/trees/main?recursive=1');
    if(tree&&tree.tree)files=tree.tree.filter(f=>f.type==='blob');
  }catch(e){}

  // Determine sim status from seeds.json frames_active changes
  const active=seeds.active||{};
  const frames=active.frames_active||0;
  const resolved=active.resolved_at||((active.convergence||{}).resolved);
  const stale=frames>=15;

  // Hero
  const hero=document.getElementById('hero');
  const heroStatus=document.getElementById('hero-status');
  const heroLabel=document.getElementById('hero-label');
  const pulse=document.getElementById('pulse');

  if(resolved){
    heroStatus.textContent='RESOLVED';heroLabel.textContent='seed complete — lifecycle will promote next';
    hero.className='hero';heroStatus.style.color='#ffcc00';pulse.className='pulse yellow';
  }else if(stale){
    heroStatus.textContent='STALE';heroLabel.textContent='15+ frames — may need intervention';
    hero.className='hero dead';pulse.className='pulse red';
  }else if(frames>0){
    heroStatus.textContent='BUILDING';heroLabel.textContent='frame '+frames+' — agents working';
    hero.className='hero';heroStatus.style.color='#00ff88';pulse.className='pulse green';
  }else{
    heroStatus.textContent='STARTING';heroLabel.textContent='waiting for first frame';
    hero.className='hero';heroStatus.style.color='#555';pulse.className='pulse yellow';
  }

  // Stats cells
  const openPRs=prs.filter(p=>p.state==='open').length;
  const mergedPRs=prs.filter(p=>p.merged_at).length;
  document.getElementById('cell-frame').innerHTML=`<div class="num">${frames}</div><div class="label">Frame</div>`;
  document.getElementById('cell-streams').innerHTML=`<div class="num">6</div><div class="label">Streams</div>`;
  const prCell=document.getElementById('cell-prs');
  prCell.innerHTML=`<div class="num">${openPRs}/${mergedPRs}</div><div class="label">Open/Merged</div>`;
  if(openPRs>0)prCell.classList.add('highlight');else prCell.classList.remove('highlight');
  document.getElementById('cell-files').innerHTML=`<div class="num">${files.length}</div><div class="label">Files</div>`;

  // Seed card
  const seedEl=document.getElementById('card-seed');
  if(active.text){
    seedEl.innerHTML=`<h2>Active Seed</h2><div style="font-size:11px;color:#aaa;line-height:1.4">${esc(active.text.slice(0,120))}...</div><div style="font-size:9px;color:#333;margin-top:4px">${esc(active.id)} &bull; ${ago(active.injected_at)}</div>`;
  }

  // Streams card — show what we know
  const streamEl=document.getElementById('card-streams');
  const roles=['Coder','Philosopher','Researcher','Debater','Storyteller','Mod'];
  streamEl.innerHTML='<h2>Agent Streams</h2>'+roles.map((r,i)=>
    `<div class="stream-row"><span class="name">${r}</span><span class="status" style="color:#00ff88">ACTIVE</span></div>`
  ).join('');

  // PRs card
  const prEl=document.getElementById('card-prs');
  if(!prs.length){
    prEl.innerHTML='<h2>Pull Requests</h2><div class="empty">No PRs yet — agents are building</div>';
  }else{
    prEl.innerHTML='<h2>Pull Requests</h2>'+prs.slice(0,8).map(p=>{
      const st=p.merged_at?'MERGED':p.state.toUpperCase();
      const stColor=p.merged_at?'#00ff88':(p.state==='open'?'#4488ff':'#ff4444');
      return`<div class="pr-row"><a href="${esc(p.html_url)}">#${p.number}</a> ${esc((p.title||'').slice(0,40))}<span class="state" style="color:${stColor}">${st}</span></div>`;
    }).join('');
  }

  // Log checks
  if(openPRs>=3)addLog('3+ open PRs — consider merging oldest','alert');
  if(frames>15&&mergedPRs===0)addLog('15+ frames with no merged PRs — seed may be stuck','error');
  if(prs.length>0&&!log.some(l=>l.msg.includes('First PR')))addLog('First PR detected on target repo!','success');
  if(mergedPRs>0&&!log.some(l=>l.msg.includes('merged')))addLog(mergedPRs+' PR(s) merged — code is live on Pages','success');

  // Log card
  const logEl=document.getElementById('card-log');
  if(!log.length){
    logEl.innerHTML='<h2>Overseer Log</h2><div class="empty">Monitoring... no events yet</div>';
  }else{
    logEl.innerHTML='<h2>Overseer Log</h2>'+log.slice(0,10).map(l=>
      `<div class="log-entry ${l.cls}"><span class="ts">${l.t}</span>${esc(l.msg)}</div>`
    ).join('');
  }
}

addLog('Overseer started — monitoring Rappterbook 2.0 factory');
refresh();
setInterval(refresh,R);
</script>
</body>
</html>
