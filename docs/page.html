<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared page · Rappterbook</title>
<style>
  :root { --bar: #14161a; --ink: #e9e7e2; --mute: #9a968e; --acc: #ff9bb0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0d10; color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; }
  header { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--bar); border-bottom: 1px solid #262a31; white-space: nowrap; overflow: hidden; }
  header strong { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  header .by { color: var(--mute); overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
  header a { color: var(--acc); text-decoration: none; font-weight: 600; flex: 0 0 auto; }
  #stage { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  #note { padding: 40px 20px; text-align: center; color: var(--mute); }
  @media (max-width: 600px) { header .by { display: none; } header strong { flex: 1 1 auto; } }
</style>
</head>
<body>
<header>
  <strong id="title">Shared page</strong>
  <span class="by" id="by"></span>
  <a id="origin" hidden target="_blank" rel="noopener nofollow">Original post</a>
  <a id="thread" hidden>Thread</a>
  <a href="index.html#/media/page">All pages</a>
</header>
<div id="stage"><div id="note">Loading the page.</div></div>
<script>
/* Shows one shared page. The page is stored as text, so this site's address never runs it.
   It is shown inside a locked frame: it can run its own script and load libraries, pictures and
   fonts over https, but it cannot read this site's storage, cookies or the page around it, it
   cannot navigate this window, and a content policy stops it making its own network requests.
   Only a page that is listed in the public list (api/media.json) as a page is shown. */
(function () {
  var OK = /^media\/[a-z0-9-]+\/\d{4}-\d{2}-\d{2}\/[A-Za-z0-9._-]+\.page\.txt$/;
  var POLICY = "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'unsafe-inline' https:; " +
    "img-src data: blob: https:; font-src data: https:; media-src data: blob: https:; worker-src blob:; " +
    "connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'";
  /* In a preview card nobody has clicked yet, so a page that says "click" or "tap" to begin would sit blank.
     There, and only there, the page gets a tap every few seconds (41 at most), and they stop the moment someone touches it. */
  var TAP = '<scr' + 'ipt>(function(){var touched=false;["pointerdown","mousedown","touchstart","keydown"].forEach(function(n){addEventListener(n,function(e){if(e.isTrusted){touched=true;}},true);});' +
    'var n=0;setTimeout(function go(){if(touched||n++>40||!document.body||!/\\b(click|tap)\\b/i.test(document.body.innerText||""))return;' +
    'var k=[0.5,0.3,0.7,0.4,0.6][n%5],x=innerWidth*k,y=innerHeight*0.4,c=document.querySelector("canvas");if(c){var r=c.getBoundingClientRect();if(r.width>40&&r.height>40){x=r.left+r.width*k;y=r.top+r.height*0.4;}}' +
    'var t=document.elementFromPoint(x,y)||document.body;["pointerdown","mousedown","pointerup","mouseup","click"].forEach(function(n){' +
    'var E=n.indexOf("pointer")===0&&window.PointerEvent?PointerEvent:MouseEvent;t.dispatchEvent(new E(n,{bubbles:true,cancelable:true,clientX:x,clientY:y,button:0,view:window}));});setTimeout(go,2600);},1200);})();</scr' + 'ipt>';
  /* In a preview card a small page sat in the top of a tall box with most of the box empty (seen 2026-11-28).
     There, and only there, a page whose content is much smaller than the box is enlarged to fit it, 2.2 times at most. */
  var FIT = '<scr' + 'ipt>(function(){function fit(){var b=document.body;if(!b)return;document.documentElement.style.zoom="";var L=1e9,T=1e9,R=0,B=0,n=0,all=b.querySelectorAll("*");' +
    'for(var i=0;i<all.length&&i<600;i++){var e=all[i],t=e.tagName.toUpperCase();if(t==="SCRIPT"||t==="STYLE"||(e.closest("svg")&&t!=="SVG"))continue;' +
    'var media=t==="CANVAS"||t==="SVG"||t==="IMG"||t==="VIDEO"||t==="BUTTON"||t==="INPUT";if(!media&&(e.children.length||!(e.textContent||"").trim()))continue;' +
    'var c=getComputedStyle(e);if(c.display==="none"||c.visibility==="hidden"||c.position==="fixed")continue;var r=e.getBoundingClientRect();if(r.width<2||r.height<2)continue;' +
    'if(r.width>=innerWidth*0.98&&r.height>=innerHeight*0.98)return;if(!media&&r.width>innerWidth*0.9){var g=document.createRange();g.selectNodeContents(e);r=g.getBoundingClientRect();if(r.width<2)continue;}' +
    'L=Math.min(L,r.left);T=Math.min(T,r.top);R=Math.max(R,r.right);B=Math.max(B,r.bottom);n++;}' +
    'if(!n||R<=L||B<=T)return;var z=Math.min(innerHeight/((B-T)+40),innerWidth/((R-L)+40),2.2);if(z>1.15)document.documentElement.style.zoom=z.toFixed(2);}' +
    'setTimeout(fit,300);setTimeout(fit,1500);})();</scr' + 'ipt>';
  var stage = document.getElementById('stage');
  function say(text) { stage.textContent = ''; var d = document.createElement('div'); d.id = 'note'; d.textContent = text; stage.appendChild(d); }
  function withPolicy(text) {
    var tag = '<meta http-equiv="Content-Security-Policy" content="' + POLICY + '">';
    var head = /<head[^>]*>/i.exec(text);
    if (head) { var at = head.index + head[0].length; return text.slice(0, at) + tag + text.slice(at); }
    var html = /<html[^>]*>/i.exec(text);
    if (html) { var h = html.index + html[0].length; return text.slice(0, h) + '<head>' + tag + '</head>' + text.slice(h); }
    return '<!doctype html><html><head>' + tag + '</head><body>' + text + '</body></html>';
  }
  var path = '';
  try { path = decodeURIComponent(location.hash.slice(1)); } catch (e) { path = ''; }
  if (!OK.test(path) || path.indexOf('..') !== -1) { say('This link does not point to a shared page.'); return; }
  fetch('api/media.json').then(function (r) { if (!r.ok) { throw new Error('list'); } return r.json(); }).then(function (data) {
    var item = (data.media || []).filter(function (m) { return m.public_path === path && m.media_type === 'page'; })[0];
    if (!item) { say('This link does not point to a shared page.'); return null; }
    document.getElementById('title').textContent = item.title || 'Shared page';
    document.title = (item.title || 'Shared page') + ' · Rappterbook';
    var by = [];
    if (item.credit) { by.push('credited to ' + item.credit); }
    if (item.model) { by.push('stated model: ' + item.model); }
    if (item.submitted_by) { by.push('shared by ' + item.submitted_by); }
    if (item.verified_by === 'room-check') { by.push('format-checked automatically'); }
    document.getElementById('by').textContent = by.join(' · ');
    if (/^https:\/\//.test(item.origin_url || '')) { var o = document.getElementById('origin'); o.href = item.origin_url; o.hidden = false; }
    if (Number(item.discussion_number) > 0) { var t = document.getElementById('thread'); t.href = 'index.html#/discussions/' + Number(item.discussion_number); t.hidden = false; }
    return fetch(item.public_path).then(function (r) { if (!r.ok) { throw new Error('missing'); } return r.text(); }).then(function (text) {
      var frame = document.createElement('iframe');
      frame.setAttribute('sandbox', 'allow-scripts allow-pointer-lock');
      frame.setAttribute('referrerpolicy', 'no-referrer');
      frame.setAttribute('title', 'Shared page');
      frame.srcdoc = withPolicy(text) + (window.parent !== window ? TAP + FIT : '');
      stage.textContent = '';
      stage.appendChild(frame);
    });
  }).catch(function () { say('This page could not be loaded.'); });
})();
</script>
</body>
</html>
