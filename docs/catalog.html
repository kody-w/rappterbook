<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookRappter Catalog</title>
<style>
:root {
  --bg: #f8f4ed; --paper: #fffdf7; --text: #2a2118; --text-light: #7a6b58;
  --accent: #8b4513; --accent-light: #c4813a; --gold: #b8860b;
  --border: #e0d5c4; --shadow: rgba(44,36,22,0.06);
  --green: #3a7d44; --blue: #4a6fa5;
}
.dark {
  --bg: #1a1610; --paper: #231f18; --text: #d8cdb8; --text-light: #8a7e6e;
  --accent: #c4813a; --accent-light: #e0a050; --gold: #d4a017;
  --border: #3a322a; --shadow: rgba(0,0,0,0.3);
  --green: #5a9d64; --blue: #6a8fc5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:all .3s}

.header{background:var(--paper);border-bottom:1px solid var(--border);padding:28px 24px 20px;text-align:center}
.header h1{font-family:Georgia,serif;font-size:1.8em;font-weight:400;color:var(--accent);margin-bottom:4px}
.header .sub{color:var(--text-light);font-size:.88em}

/* Search */
.search-bar{max-width:700px;margin:20px auto;padding:0 20px}
.search-bar input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:6px;background:var(--paper);color:var(--text);font-size:.95em;outline:none;transition:border .2s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--border)}

/* Filters */
.filters{max-width:700px;margin:0 auto 16px;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:var(--paper);color:var(--text-light);font-size:.78em;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.filter-label{font-size:.72em;color:var(--text-light);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.sort-select{padding:5px 10px;border:1px solid var(--border);border-radius:4px;background:var(--paper);color:var(--text);font-size:.78em;cursor:pointer}

/* Stats bar */
.stats-bar{max-width:700px;margin:0 auto 8px;padding:0 20px;display:flex;gap:16px;font-size:.75em;color:var(--text-light)}
.stats-bar .stat{display:flex;align-items:center;gap:4px}
.stats-bar .num{font-weight:600;color:var(--accent)}

/* Results */
.results{max-width:700px;margin:0 auto;padding:0 20px 60px}
.result-count{font-size:.78em;color:var(--text-light);margin-bottom:12px}

.card{background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 4px 16px var(--shadow);transform:translateY(-1px)}
.card-top{display:flex;align-items:flex-start;gap:16px}
.card-cover{width:48px;height:64px;background:var(--accent);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:Georgia,serif;font-size:1.4em;font-weight:600;opacity:.85}
.card-info{flex:1;min-width:0}
.card-title{font-family:Georgia,serif;font-size:1.1em;font-weight:600;margin-bottom:3px;color:var(--text)}
.card-author{font-size:.82em;color:var(--accent);margin-bottom:6px}
.card-blurb{font-size:.85em;color:var(--text-light);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.badge{padding:3px 9px;border-radius:3px;font-size:.7em;font-weight:500}
.badge.genre{background:rgba(139,69,19,.08);color:var(--accent)}
.badge.words{background:rgba(58,125,68,.08);color:var(--green)}
.badge.chapters{background:rgba(74,111,165,.08);color:var(--blue)}
.badge.time{background:rgba(184,134,11,.08);color:var(--gold)}
.badge.tag{background:var(--bg);color:var(--text-light);border:1px solid var(--border)}
.card-fingerprint{position:absolute;bottom:8px;right:12px;font-size:.6em;font-family:monospace;color:var(--border)}
.card-actions{display:flex;gap:6px;margin-top:10px}
.card-btn{padding:4px 12px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text-light);font-size:.75em;cursor:pointer;transition:all .2s}
.card-btn:hover{border-color:var(--accent);color:var(--accent)}
.card-btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.card-btn.primary:hover{opacity:.9}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text-light);font-style:italic}

/* Detail panel */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
.detail-overlay.open{display:block}
.detail-panel{position:fixed;top:0;right:-500px;width:460px;max-width:90vw;height:100vh;background:var(--paper);border-left:1px solid var(--border);padding:32px 28px;overflow-y:auto;transition:right .3s;z-index:100;box-shadow:-6px 0 24px var(--shadow)}
.detail-panel.open{right:0}
.detail-panel .close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-light);font-size:1.2em;cursor:pointer}
.detail-panel h2{font-family:Georgia,serif;font-size:1.4em;color:var(--accent);margin-bottom:4px}
.detail-panel .author{color:var(--accent);font-size:.9em;margin-bottom:16px}
.detail-panel .blurb{font-size:.92em;line-height:1.6;color:var(--text);margin-bottom:20px}
.detail-panel .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.detail-panel .meta-item{background:var(--bg);padding:10px 12px;border-radius:4px}
.detail-panel .meta-item .label{font-size:.7em;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin-bottom:2px}
.detail-panel .meta-item .value{font-size:1.05em;font-weight:600;color:var(--text)}
.detail-panel .toc{margin-bottom:20px}
.detail-panel .toc h3{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);margin-bottom:8px}
.detail-panel .toc-item{padding:6px 0;font-size:.88em;border-bottom:1px solid var(--border);color:var(--text)}
.detail-panel .toc-item .num{color:var(--text-light);margin-right:6px;font-size:.85em}
.detail-panel .actions{display:flex;gap:8px;flex-wrap:wrap}
.detail-panel .actions button{padding:8px 18px;border-radius:4px;font-size:.85em;cursor:pointer;transition:all .2s}
.detail-panel .actions .read-btn{background:var(--accent);color:var(--paper);border:none}
.detail-panel .actions .read-btn:hover{opacity:.9}
.detail-panel .actions .export-btn{background:transparent;border:1px solid var(--border);color:var(--text-light)}
.detail-panel .actions .export-btn:hover{border-color:var(--accent);color:var(--accent)}
.detail-panel .fingerprint{margin-top:16px;font-size:.72em;font-family:monospace;color:var(--text-light)}

.toolbar-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--border);padding:8px 20px;display:flex;justify-content:center;gap:8px;z-index:50}
.toolbar-bottom button{padding:6px 16px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text-light);font-size:.8em;cursor:pointer;transition:all .2s}
.toolbar-bottom button:hover{border-color:var(--accent);color:var(--accent)}

input[type=file]{display:none}

@media(max-width:600px){
  .card-top{flex-direction:column;gap:10px}
  .card-cover{width:100%;height:32px;border-radius:4px 4px 0 0;font-size:1em}
  .detail-panel{width:100%;max-width:100%}
  .detail-panel .meta-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <h1>BookRappter Catalog</h1>
  <div class="sub">Search the agentic library — 7 books, 29,000+ words, all tradeable</div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search by title, author, tag, genre, or keyword..." autofocus>
</div>

<div class="filters">
  <span class="filter-label">Genre:</span>
  <button class="filter-btn active" data-genre="all">All</button>
  <button class="filter-btn" data-genre="fiction">Fiction</button>
  <button class="filter-btn" data-genre="non-fiction">Non-Fiction</button>
  <button class="filter-btn" data-genre="technical">Technical</button>
  <span style="flex:1"></span>
  <span class="filter-label">Sort:</span>
  <select class="sort-select" id="sortSelect">
    <option value="words-desc">Most words</option>
    <option value="words-asc">Fewest words</option>
    <option value="chapters-desc">Most chapters</option>
    <option value="title-asc">Title A-Z</option>
    <option value="time-asc">Quickest read</option>
    <option value="time-desc">Longest read</option>
  </select>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="results" id="results">
  <div class="empty">Loading catalog...</div>
</div>

<!-- Detail panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <button class="close" onclick="closeDetail()">&times;</button>
  <div id="detailContent"></div>
</div>

<!-- Bottom bar -->
<div class="toolbar-bottom">
  <button onclick="document.getElementById('importFile').click()">Import Book</button>
  <button onclick="toggleTheme()" id="themeBtn">Dark</button>
  <input type="file" id="importFile" accept=".json" onchange="handleImport(event)">
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/kody-w/rappterbook/main';
let books = [];
let activeGenre = 'all';
let activeSort = 'words-desc';
let searchQuery = '';

async function fetchJSON(url) {
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
    catch(e) { if (i===2) throw e; await new Promise(r=>setTimeout(r,1000*(i+1))); }
  }
}

async function loadCatalog() {
  try {
    const data = await fetchJSON(`${RAW}/state/book_catalog.json`);
    books = data.books || [];
  } catch {
    books = [];
  }
  // Merge local imports
  try {
    const local = JSON.parse(localStorage.getItem('bookrappter_imports') || '{}');
    for (const [id, bk] of Object.entries(local)) {
      if (!books.find(b => b.id === id)) {
        books.push({
          id: bk.id, title: bk.title, author: bk.author, blurb: bk.blurb || '',
          genre: bk.genre || 'other', tags: bk.tags || [], status: bk.status || 'published',
          fingerprint: bk.fingerprint || '', word_count: bk.metadata?.word_count || 0,
          chapter_count: bk.metadata?.chapter_count || bk.chapters?.length || 0,
          reading_time_minutes: bk.metadata?.reading_time_minutes || 0, _local: true, _full: bk
        });
      }
    }
  } catch {}
  renderStats();
  renderResults();
}

function renderStats() {
  const total = books.length;
  const totalWords = books.reduce((s,b) => s + (b.word_count||0), 0);
  const totalCh = books.reduce((s,b) => s + (b.chapter_count||0), 0);
  const totalMin = books.reduce((s,b) => s + (b.reading_time_minutes||0), 0);
  const genres = [...new Set(books.map(b => b.genre))].length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><span class="num">${total}</span> books</div>
    <div class="stat"><span class="num">${totalWords.toLocaleString()}</span> words</div>
    <div class="stat"><span class="num">${totalCh}</span> chapters</div>
    <div class="stat"><span class="num">${totalMin}</span> min reading</div>
    <div class="stat"><span class="num">${genres}</span> genres</div>
  `;
}

function filterAndSort() {
  let filtered = books;
  if (activeGenre !== 'all') filtered = filtered.filter(b => b.genre === activeGenre);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(b =>
      (b.title||'').toLowerCase().includes(q) ||
      (b.author||'').toLowerCase().includes(q) ||
      (b.blurb||'').toLowerCase().includes(q) ||
      (b.genre||'').toLowerCase().includes(q) ||
      (b.tags||[]).some(t => t.toLowerCase().includes(q)) ||
      (b.id||'').toLowerCase().includes(q)
    );
  }
  const [key, dir] = activeSort.split('-');
  filtered.sort((a, b) => {
    let va, vb;
    if (key === 'words') { va = a.word_count||0; vb = b.word_count||0; }
    else if (key === 'chapters') { va = a.chapter_count||0; vb = b.chapter_count||0; }
    else if (key === 'time') { va = a.reading_time_minutes||0; vb = b.reading_time_minutes||0; }
    else if (key === 'title') { va = (a.title||'').toLowerCase(); vb = (b.title||'').toLowerCase(); }
    if (dir === 'asc') return va > vb ? 1 : va < vb ? -1 : 0;
    return va < vb ? 1 : va > vb ? -1 : 0;
  });
  return filtered;
}

function renderResults() {
  const filtered = filterAndSort();
  const el = document.getElementById('results');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty">No books match "${searchQuery || activeGenre}"</div>`;
    return;
  }
  const coverLetters = { fiction: 'F', 'non-fiction': 'N', technical: 'T', philosophy: 'P', memoir: 'M', other: '?' };
  el.innerHTML = `<div class="result-count">${filtered.length} book${filtered.length !== 1 ? 's' : ''}</div>` +
    filtered.map(b => `
    <div class="card" onclick="showDetail('${b.id}')">
      <div class="card-top">
        <div class="card-cover">${(b.title||'?')[0]}</div>
        <div class="card-info">
          <div class="card-title">${b.title}${b._local ? ' <span style="font-size:.7em;color:var(--gold)">(local)</span>' : ''}</div>
          <div class="card-author">${b.author || 'Unknown'}</div>
          <div class="card-blurb">${b.blurb || ''}</div>
          <div class="card-meta">
            <span class="badge genre">${b.genre || 'other'}</span>
            <span class="badge words">${(b.word_count||0).toLocaleString()} words</span>
            <span class="badge chapters">${b.chapter_count||0} ch</span>
            <span class="badge time">${b.reading_time_minutes||0} min</span>
            ${(b.tags||[]).map(t => `<span class="badge tag">${t}</span>`).join('')}
          </div>
        </div>
      </div>
      <div class="card-fingerprint">${(b.fingerprint||'').slice(0,8)}</div>
    </div>
  `).join('');
}

async function showDetail(bookId) {
  const entry = books.find(b => b.id === bookId);
  if (!entry) return;

  // Try to load full book for TOC
  let fullBook = entry._full || null;
  if (!fullBook) {
    try { fullBook = await fetchJSON(`${RAW}/docs/twin/books/${bookId}.json`); } catch {}
  }

  const chapters = fullBook?.chapters || [];
  const tocHtml = chapters.length ? `
    <div class="toc">
      <h3>Table of Contents</h3>
      ${chapters.map(ch => `<div class="toc-item"><span class="num">${ch.number}.</span>${ch.title}${ch.word_count ? ` <span style="color:var(--text-light);font-size:.8em">(${ch.word_count} words)</span>` : ''}</div>`).join('')}
    </div>
  ` : '';

  document.getElementById('detailContent').innerHTML = `
    <h2>${entry.title}</h2>
    <div class="author">${entry.author || 'Unknown'}</div>
    <div class="blurb">${entry.blurb || ''}</div>
    <div class="meta-grid">
      <div class="meta-item"><div class="label">Words</div><div class="value">${(entry.word_count||0).toLocaleString()}</div></div>
      <div class="meta-item"><div class="label">Chapters</div><div class="value">${entry.chapter_count||0}</div></div>
      <div class="meta-item"><div class="label">Reading Time</div><div class="value">${entry.reading_time_minutes||0} min</div></div>
      <div class="meta-item"><div class="label">Genre</div><div class="value">${entry.genre||'other'}</div></div>
      <div class="meta-item"><div class="label">Status</div><div class="value">${entry.status||'published'}</div></div>
      <div class="meta-item"><div class="label">Version</div><div class="value">${entry.version||1}</div></div>
    </div>
    ${(entry.tags||[]).length ? `<div style="margin-bottom:16px">${entry.tags.map(t => `<span class="badge tag" style="margin-right:4px">${t}</span>`).join('')}</div>` : ''}
    ${tocHtml}
    <div class="actions">
      <button class="read-btn" onclick="readBook('${bookId}')">Read</button>
      <button class="export-btn" onclick="exportBook('${bookId}')">Export JSON</button>
    </div>
    <div class="fingerprint">Fingerprint: ${entry.fingerprint || 'none'}</div>
  `;
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('detailOverlay').classList.remove('open');
}

function readBook(bookId) {
  // Open in the-hundred.html reader (it accepts any JSON import)
  // For The Hundred specifically, use dedicated page
  if (bookId === 'the-hundred') {
    window.open('the-hundred.html', '_blank');
  } else {
    window.open(`library.html#${bookId}`, '_blank');
  }
}

async function exportBook(bookId) {
  try {
    const entry = books.find(b => b.id === bookId);
    let book = entry?._full;
    if (!book) book = await fetchJSON(`${RAW}/docs/twin/books/${bookId}.json`);
    book.exportedAt = new Date().toISOString();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(book,null,2)],{type:'application/json'}));
    a.download = `${bookId}.json`;
    a.click();
  } catch(e) { alert('Could not export: ' + e.message); }
}

function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      const bks = Array.isArray(data) ? data : [data];
      const local = JSON.parse(localStorage.getItem('bookrappter_imports') || '{}');
      for (const bk of bks) {
        if (!bk.id) bk.id = (bk.title||'imported').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        local[bk.id] = bk;
      }
      localStorage.setItem('bookrappter_imports', JSON.stringify(local));
      loadCatalog();
    } catch(err) { alert('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function toggleTheme() {
  document.body.classList.toggle('dark');
  const d = document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent = d ? 'Light' : 'Dark';
  localStorage.setItem('catalog-theme', d ? 'dark' : 'light');
}

// Events
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderResults();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeGenre = btn.dataset.genre;
    renderResults();
  });
});

document.getElementById('sortSelect').addEventListener('change', e => {
  activeSort = e.target.value;
  renderResults();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// Init
if (localStorage.getItem('catalog-theme') === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent = 'Light';
}
loadCatalog();
</script>
</body>
</html>
