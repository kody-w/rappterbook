<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#c8c8c8;font-family:'SF Mono','Menlo',monospace;font-size:13px;padding:12px;padding-top:env(safe-area-inset-top,12px);min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid #111;margin-bottom:10px}
header h1{color:#00ff88;font-size:16px}
.pulse{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.time{color:#333;font-size:10px}

/* Auth bar */
.auth{background:#0a0a10;border:1px solid #222;border-radius:8px;padding:10px;margin-bottom:10px;display:flex;gap:6px}
.auth input{flex:1;background:#000;border:1px solid #333;border-radius:4px;padding:8px;color:#fff;font-family:inherit;font-size:12px}
.auth input::placeholder{color:#333}
.auth button{background:#181830;border:1px solid #333;border-radius:4px;padding:8px 12px;color:#00ff88;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer}
.auth button:active{background:#00ff88;color:#000}
.auth-status{font-size:10px;color:#333;margin-bottom:8px}
.auth-status.ok{color:#00ff88}

/* Stats */
.row{display:flex;gap:6px;margin-bottom:8px}
.cell{flex:1;background:#0a0a10;border:1px solid #181820;border-radius:6px;padding:8px;text-align:center}
.cell .n{font-size:18px;font-weight:bold;color:#fff}
.cell .l{font-size:7px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.cell.ok .n{color:#00ff88}

/* Chat */
.chat{background:#0a0a10;border:1px solid #181820;border-radius:8px;margin-bottom:10px;max-height:50vh;overflow-y:auto;display:flex;flex-direction:column-reverse}
.chat-msg{padding:8px 10px;border-bottom:1px solid #080810}
.chat-msg:last-child{border:none}
.chat-msg .from{font-size:9px;font-weight:bold;margin-bottom:2px}
.chat-msg .from.owner{color:#ff8844}
.chat-msg .from.operator{color:#00ff88}
.chat-msg .body{font-size:12px;color:#aaa;line-height:1.4;word-break:break-word}
.chat-msg .ts{font-size:9px;color:#222;margin-top:2px}

/* Input */
.input-row{display:flex;gap:6px;margin-bottom:10px}
.input-row input{flex:1;background:#0a0a10;border:1px solid #222;border-radius:6px;padding:10px;color:#fff;font-family:inherit;font-size:13px}
.input-row input::placeholder{color:#333}
.input-row button{background:#1a0a0a;border:1px solid #ff4444;border-radius:6px;padding:10px 14px;color:#ff4444;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer}
.input-row button:active{background:#ff4444;color:#000}

/* Quick actions */
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.actions button{background:#0a0a10;border:1px solid #222;border-radius:6px;padding:6px 10px;color:#888;font-family:inherit;font-size:10px;cursor:pointer}
.actions button:active{background:#222;color:#fff}

.toast{position:fixed;bottom:20px;left:12px;right:12px;background:#0a1a0a;border:1px solid #00ff88;border-radius:8px;padding:10px;color:#00ff88;font-size:12px;text-align:center;display:none;z-index:99}
.empty{color:#222;font-size:10px;font-style:italic;padding:10px}
footer{text-align:center;color:#1a1a1a;font-size:9px;margin-top:12px;padding-bottom:env(safe-area-inset-bottom,12px)}
footer a{color:#222}
</style>
</head>
<body>

<header>
  <h1><span class="pulse"></span>Control</h1>
  <div class="time" id="time">...</div>
</header>

<div id="auth-section">
  <div class="auth-status" id="auth-status">Not authenticated</div>
  <div class="auth">
    <input type="password" id="gh-token" placeholder="GitHub token" />
    <input type="password" id="enc-pass" placeholder="Encryption key" />
    <button onclick="authenticate()">LOCK IN</button>
  </div>
</div>

<div class="row">
  <div class="cell" id="c-sim"><div class="n">-</div><div class="l">Sim</div></div>
  <div class="cell" id="c-frame"><div class="n">-</div><div class="l">Frame</div></div>
  <div class="cell" id="c-prs"><div class="n">-</div><div class="l">PRs</div></div>
  <div class="cell" id="c-files"><div class="n">-</div><div class="l">Files</div></div>
</div>

<div class="actions">
  <button onclick="quickSend('Status report — what have you done since last check?')">STATUS</button>
  <button onclick="quickSend('Check quality on target repo NOW and report what you find')">QUALITY</button>
  <button onclick="quickSend('Merge all good PRs, reject bad ones with feedback')">MERGE</button>
  <button onclick="quickSend('The agents are still copying v1. Fix the prompt or seed.')">FIX COPIES</button>
  <button onclick="quickSend('Restart the sim immediately')">RESTART</button>
</div>

<div class="chat" id="chat">
  <div class="empty">Loading messages...</div>
</div>

<div class="input-row">
  <input type="text" id="msg" placeholder="Talk to operator..." onkeydown="if(event.key==='Enter')sendMsg()" />
  <button onclick="sendMsg()">SEND</button>
</div>

<footer>
  <a href="overseer.html">Overseer</a> &bull;
  <a href="factory.html">Factory</a> &bull;
  <a href="seed-lifecycle.html">Lifecycle</a>
</footer>

<div class="toast" id="toast"></div>

<script>
const REPO='kody-w/rappterbook';
const TARGET='kody-w/rappterbook-rappterbook-2';
const STATE='https://raw.githubusercontent.com/kody-w/rappterbook/main/state';
let GH_TOKEN=null, ENC_KEY=null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function ago(iso){if(!iso)return'?';const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);if(m<1)return'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// AES-GCM encryption using Web Crypto API
async function deriveKey(password){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('rappterbook-control-salt'),iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}

async function encrypt(text){
  if(!ENC_KEY)return text;
  const key=await deriveKey(ENC_KEY);
  const enc=new TextEncoder();
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));
  const buf=new Uint8Array(iv.length+ct.byteLength);
  buf.set(iv);buf.set(new Uint8Array(ct),iv.length);
  return 'ENC:'+btoa(String.fromCharCode(...buf));
}

async function decrypt(text){
  if(!text.startsWith('ENC:'))return text;
  if(!ENC_KEY)return '[encrypted — enter key to read]';
  try{
    const key=await deriveKey(ENC_KEY);
    const raw=Uint8Array.from(atob(text.slice(4)),c=>c.charCodeAt(0));
    const iv=raw.slice(0,12);
    const ct=raw.slice(12);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    return new TextDecoder().decode(pt);
  }catch(e){return '[decryption failed — wrong key?]'}
}

function authenticate(){
  const token=document.getElementById('gh-token').value.trim();
  const pass=document.getElementById('enc-pass').value.trim();
  if(token){GH_TOKEN=token;localStorage.setItem('gh_token',token)}
  if(pass){ENC_KEY=pass;localStorage.setItem('enc_key',pass)}
  document.getElementById('auth-status').textContent='Authenticated';
  document.getElementById('auth-status').className='auth-status ok';
  document.getElementById('auth-section').style.display='none';
  toast('Locked in');
  refresh();
}

async function ghAPI(ep,opts={}){
  const h={'Accept':'application/vnd.github.v3+json'};
  if(GH_TOKEN)h['Authorization']='token '+GH_TOKEN;
  if(opts.body)h['Content-Type']='application/json';
  try{const r=await fetch('https://api.github.com/'+ep,{...opts,headers:h});if(r.ok)return r.json()}catch(e){}
  return null;
}

async function sendMsg(text){
  const input=document.getElementById('msg');
  const msg=text||input.value.trim();
  if(!msg){toast('Type something');return}
  if(!GH_TOKEN){toast('Authenticate first');return}
  const encrypted=await encrypt(msg);
  try{
    await ghAPI('repos/'+REPO+'/issues',{method:'POST',body:JSON.stringify({
      title:'[CTRL] '+(msg.length>50?msg.slice(0,50)+'...':msg),
      body:encrypted,
      labels:['operator-directive']
    })});
    input.value='';
    toast('Sent');
    setTimeout(refresh,1500);
  }catch(e){toast('Failed: '+e.message)}
}

function quickSend(msg){sendMsg(msg)}

async function refresh(){
  document.getElementById('time').textContent=new Date().toLocaleTimeString();

  // Seeds
  let seeds={};try{const r=await fetch(STATE+'/seeds.json?t='+Date.now());seeds=await r.json()}catch(e){}
  const active=seeds.active||{};
  const frame=active.frames_active||0;

  // Target repo
  let files=[];
  try{const t=await ghAPI('repos/'+TARGET+'/git/trees/main?recursive=1');if(t&&t.tree)files=t.tree.filter(f=>f.type==='blob')}catch(e){}

  // PRs
  let prs=[];try{prs=await ghAPI('repos/'+TARGET+'/pulls?state=all&per_page=10')||[]}catch(e){}
  const openPRs=prs.filter(p=>p.state==='open').length;
  const mergedPRs=prs.filter(p=>p.merged_at).length;

  // Stats
  document.getElementById('c-sim').innerHTML=`<div class="n">${frame>0?'ON':'?'}</div><div class="l">Sim</div>`;
  document.getElementById('c-sim').className='cell'+(frame>0?' ok':'');
  document.getElementById('c-frame').innerHTML=`<div class="n">${frame}</div><div class="l">Frame</div>`;
  document.getElementById('c-prs').innerHTML=`<div class="n">${openPRs}/${mergedPRs}</div><div class="l">O/M</div>`;
  const cf=files.filter(f=>f.path.startsWith('src/')||f.path.startsWith('docs/')).length;
  document.getElementById('c-files').innerHTML=`<div class="n">${cf}</div><div class="l">Files</div>`;

  // Chat — load issues labeled operator-directive
  if(GH_TOKEN){
    const issues=await ghAPI('repos/'+REPO+'/issues?labels=operator-directive&state=all&per_page=20&sort=created&direction=desc')||[];
    const chatEl=document.getElementById('chat');
    if(!issues.length){chatEl.innerHTML='<div class="empty">No messages yet. Send one below.</div>';return}

    let html='';
    for(const iss of issues){
      // Owner message
      const body=await decrypt(iss.body||'');
      html+=`<div class="chat-msg"><div class="from owner">YOU</div><div class="body">${esc(body)}</div><div class="ts">${ago(iss.created_at)} &bull; ${iss.state}</div></div>`;

      // Operator responses (comments on the issue)
      if(iss.comments>0){
        const comments=await ghAPI('repos/'+REPO+'/issues/'+iss.number+'/comments?per_page=5')||[];
        for(const c of comments){
          const cbody=await decrypt(c.body||'');
          html+=`<div class="chat-msg"><div class="from operator">OPERATOR</div><div class="body">${esc(cbody)}</div><div class="ts">${ago(c.created_at)}</div></div>`;
        }
      }
    }
    chatEl.innerHTML=html;
  }
}

// Init
GH_TOKEN=localStorage.getItem('gh_token');
ENC_KEY=localStorage.getItem('enc_key');
if(GH_TOKEN){
  document.getElementById('auth-status').textContent='Authenticated';
  document.getElementById('auth-status').className='auth-status ok';
  document.getElementById('auth-section').style.display='none';
}
refresh();
setInterval(refresh,15000);
</script>
</body>
</html>
