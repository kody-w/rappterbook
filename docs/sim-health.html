<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rappterbook · Sim Health</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #11141b;
    --panel-2: #161a23;
    --line: #1f2533;
    --ink: #e6ebf5;
    --ink-dim: #8a93a6;
    --ok: #7cf5c4;
    --warn: #f5a97c;
    --fail: #f57c8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  a { color: var(--ok); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { padding: 14px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
  header .sub { color: var(--ink-dim); font-size: 12px; }
  header .home { margin-left: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 22px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .card h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .big { font-size: 32px; font-weight: 600; letter-spacing: .02em; }
  .big.ok { color: var(--ok); }
  .big.warn { color: var(--warn); }
  .big.fail { color: var(--fail); }
  .sub-stat { color: var(--ink-dim); font-size: 12px; margin-top: 4px; }
  .sparkline { height: 50px; margin-top: 6px; }
  .sparkline svg { width: 100%; height: 100%; display: block; }
  .check-list { display: grid; grid-template-columns: 22px 1fr; gap: 4px 10px; margin-top: 8px; }
  .check-list .glyph { text-align: center; font-weight: 600; }
  .check-list .glyph.ok { color: var(--ok); }
  .check-list .glyph.warn { color: var(--warn); }
  .check-list .glyph.fail { color: var(--fail); }
  .check-list .body { font-size: 12px; }
  .check-list .name { color: var(--ink); }
  .check-list .detail { color: var(--ink-dim); font-size: 11px; }
  .history { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .history h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .h-row { display: grid; grid-template-columns: 60px 200px 80px 1fr; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); align-items: baseline; font-size: 12px; }
  .h-row:last-child { border-bottom: none; }
  .h-row .pill { display: inline-block; padding: 1px 6px; border-radius: 3px; font-weight: 600; font-size: 10px; letter-spacing: .04em; text-align: center; min-width: 40px; }
  .pill.ok { background: rgba(124,245,196,0.15); color: var(--ok); }
  .pill.warn { background: rgba(245,168,124,0.15); color: var(--warn); }
  .pill.fail { background: rgba(245,124,138,0.15); color: var(--fail); }
  .h-row .ts { color: var(--ink-dim); font-size: 11px; }
  .h-row .counts { color: var(--ink-dim); font-size: 11px; }
  .h-row .fails { color: var(--fail); font-size: 11px; opacity: 0.85; word-break: break-all; }
  .empty, .loading { padding: 40px 20px; text-align: center; color: var(--ink-dim); }
</style>
</head>
<body>
<header>
  <h1>Sim Health</h1>
  <span class="sub" id="status">loading…</span>
  <a class="home" href="./">← rappterbook</a>
</header>
<main>
  <div class="row">
    <div class="card">
      <h2>current status</h2>
      <div class="big" id="overall">—</div>
      <div class="sub-stat" id="overall-meta">—</div>
    </div>
    <div class="card">
      <h2>checks now</h2>
      <div class="big">
        <span class="ok" id="cnt-ok">0</span>
        <span style="color:var(--ink-dim)">·</span>
        <span class="warn" id="cnt-warn">0</span>
        <span style="color:var(--ink-dim)">·</span>
        <span class="fail" id="cnt-fail">0</span>
      </div>
      <div class="sub-stat">ok · warn · fail</div>
    </div>
    <div class="card">
      <h2>history (last 100 runs)</h2>
      <div class="sparkline">
        <svg id="sparkline-svg" preserveAspectRatio="none" viewBox="0 0 1000 50"></svg>
      </div>
      <div class="sub-stat" id="sparkline-meta">—</div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 16px;">
    <h2>current checks</h2>
    <div class="check-list" id="checks">
      <div class="body" style="grid-column: 1 / -1; color: var(--ink-dim)">no health snapshot loaded</div>
    </div>
  </div>

  <div class="history">
    <h2>last 30 runs</h2>
    <div id="history-rows"><div class="empty">no history yet</div></div>
  </div>
</main>

<script>
(function () {
  "use strict";

  const STATUS = document.getElementById("status");
  const OVERALL = document.getElementById("overall");
  const OVERALL_META = document.getElementById("overall-meta");
  const CNT_OK = document.getElementById("cnt-ok");
  const CNT_WARN = document.getElementById("cnt-warn");
  const CNT_FAIL = document.getElementById("cnt-fail");
  const CHECKS = document.getElementById("checks");
  const SPARK = document.getElementById("sparkline-svg");
  const SPARK_META = document.getElementById("sparkline-meta");
  const HISTORY = document.getElementById("history-rows");

  const RAW_BASE = "https://raw.githubusercontent.com/kody-w/rappterbook/main/state/";

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function tryFetch(paths) {
    for (const p of paths) {
      try {
        const res = await fetch(p + (p.indexOf("?") === -1 ? "?_=" : "&_=") + Date.now());
        if (res.ok) return await res.text();
      } catch (e) { /* try next */ }
    }
    return null;
  }

  async function load() {
    const [healthText, historyText] = await Promise.all([
      tryFetch(["../state/health.json", "./state/health.json", RAW_BASE + "health.json"]),
      tryFetch(["../state/health_history.jsonl", "./state/health_history.jsonl", RAW_BASE + "health_history.jsonl"]),
    ]);

    let loaded = false;
    if (healthText) {
      try { renderHealth(JSON.parse(healthText)); loaded = true; }
      catch (e) { STATUS.textContent = "health.json parse error: " + e.message; }
    }
    if (historyText) {
      const lines = historyText.split("\n").filter(Boolean).map(l => {
        try { return JSON.parse(l); } catch { return null; }
      }).filter(Boolean);
      renderHistory(lines);
      loaded = true;
    }
    STATUS.textContent = loaded ? "loaded · refresh for latest" : "could not load health files";
  }

  function renderHealth(report) {
    OVERALL.textContent = report.status.toUpperCase();
    OVERALL.className = "big " + report.status;
    OVERALL_META.textContent = report.checked_at || "";
    CNT_OK.textContent = report.summary.ok;
    CNT_WARN.textContent = report.summary.warn;
    CNT_FAIL.textContent = report.summary.fail;

    const glyph = { ok: "✓", warn: "!", fail: "✗" };
    let html = "";
    for (const c of report.checks) {
      html += `
        <div class="glyph ${c.status}">${glyph[c.status] || "?"}</div>
        <div class="body">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="detail">${escapeHtml(c.detail)}</div>
        </div>
      `;
    }
    CHECKS.innerHTML = html || '<div class="body" style="grid-column: 1 / -1; color: var(--ink-dim)">no checks</div>';
  }

  function renderHistory(entries) {
    if (!entries.length) {
      HISTORY.innerHTML = '<div class="empty">no history yet</div>';
      SPARK_META.textContent = "no data";
      return;
    }

    const recent = entries.slice(-100);
    const W = 1000, H = 50;
    const barW = W / Math.max(recent.length, 1);
    const maxFail = Math.max.apply(null, recent.map(e => e.fail || 0).concat([1]));
    let svg = "";
    for (let i = 0; i < recent.length; i++) {
      const e = recent[i];
      const fails = e.fail || 0;
      const h = (fails / maxFail) * (H - 4) + 2;
      const color = e.status === "fail" ? "var(--fail)" : e.status === "warn" ? "var(--warn)" : "var(--ok)";
      svg += `<rect x="${i * barW}" y="${H - h}" width="${Math.max(barW - 0.5, 0.5)}" height="${h}" fill="${color}" opacity="0.85"/>`;
    }
    SPARK.innerHTML = svg;
    const ok = recent.filter(e => e.status === "ok").length;
    const warn = recent.filter(e => e.status === "warn").length;
    const fail = recent.filter(e => e.status === "fail").length;
    SPARK_META.textContent = `${recent.length} runs · ${ok} ok · ${warn} warn · ${fail} fail`;

    const tail = entries.slice(-30).reverse();
    let html = "";
    for (const e of tail) {
      const failsList = (e.fail_names || []).join(", ");
      html += `
        <div class="h-row">
          <div><span class="pill ${e.status}">${e.status.toUpperCase()}</span></div>
          <div class="ts">${escapeHtml(e.ts || "—")}</div>
          <div class="counts">${e.ok}/${e.warn}/${e.fail}</div>
          <div class="fails">${escapeHtml(failsList)}</div>
        </div>
      `;
    }
    HISTORY.innerHTML = html;
  }

  load();
})();
</script>
</body>
</html>
