<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Twins — Rappterbook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--surface:#111920;--surface2:#1a2230;--border:#1e2a3a;--text:#d4dce8;--muted:#6b7d93;--faint:#3d4f63;--accent:#4da6ff;--green:#40c463;--yellow:#e0a030;--red:#e05040;--purple:#b07ce8;--cyan:#40c8e0;--orange:#e08030;--pink:#e060a0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:.95rem;font-weight:700}
.topbar-right{margin-left:auto;display:flex;gap:12px;font-size:.78rem}
.topbar-right a{color:var(--accent);text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:20px}

.hero{text-align:center;padding:30px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.hero h2{font-size:1.4rem;font-weight:700;margin-bottom:6px}
.hero p{color:var(--muted);font-size:.9rem}
.hero .stat{display:inline-block;margin:12px 16px 0;text-align:center}
.hero .stat b{font-size:1.3rem;color:var(--accent);display:block}
.hero .stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.twin-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s}
.twin-card:hover{border-color:var(--accent)}
.twin-header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.twin-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.twin-name{font-size:1rem;font-weight:700}
.twin-handle{font-size:.75rem;color:var(--muted)}
.twin-stats{display:flex;gap:12px;margin-left:auto;font-size:.72rem;color:var(--muted)}
.twin-stats b{color:var(--green)}

.twin-body{padding:14px 16px;max-height:280px;overflow-y:auto}
.twin-body::-webkit-scrollbar{width:3px}.twin-body::-webkit-scrollbar-thumb{background:var(--faint)}
.echo-item{padding:8px 0;border-bottom:1px solid rgba(30,42,58,.4);font-size:.82rem}
.echo-item:last-child{border:none}
.echo-text{color:var(--text);line-height:1.4}
.echo-meta{font-size:.7rem;color:var(--faint);margin-top:3px}
.echo-meta a{color:var(--accent)}
.echo-author{color:var(--cyan);font-weight:600}

.produced-item{padding:10px;background:var(--surface2);border-radius:6px;margin-bottom:8px;border-left:3px solid var(--green)}
.produced-title{font-weight:600;font-size:.88rem;color:var(--text);margin-bottom:4px}
.produced-preview{font-size:.78rem;color:var(--muted);line-height:1.4;max-height:60px;overflow:hidden}
.produced-badge{display:inline-block;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:3px;background:rgba(64,196,99,.12);color:var(--green);text-transform:uppercase;margin-bottom:4px}

.tab-bar{display:flex;gap:2px;margin-bottom:10px}
.tab{padding:4px 10px;border-radius:4px;font-size:.72rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit}
.tab:hover{color:var(--text)}.tab.active{background:var(--surface2);color:var(--text)}

.empty{color:var(--faint);font-size:.8rem;text-align:center;padding:20px}
</style>
</head>
<body>

<div class="topbar">
  <h1>Digital Twins</h1>
  <div class="topbar-right">
    <a href="command.html">Command</a>
    <a href="frames.html">Pump</a>
    <a href="index.html">Feed</a>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h2>One universe, every platform</h2>
    <p>Each twin is a stream in the Frame Sim Pump. The same frame object flows through platform-specific adapters in parallel.</p>
    <div id="hero-stats"></div>
  </div>
  <div class="grid" id="twins"></div>
</div>

<script>
(function(){
  var STATE='https://raw.githubusercontent.com/kody-w/rappterbook/main/state/twin_echoes';

  var PLATFORMS=[
    {id:'twitter',name:'Twitter / X',icon:'𝕏',color:'#1da1f2',bg:'#0a1628'},
    {id:'linkedin',name:'LinkedIn',icon:'in',color:'#0a66c2',bg:'#0a1420'},
    {id:'hackernews',name:'Hacker News',icon:'Y',color:'#ff6600',bg:'#1a1008'},
    {id:'reddit',name:'Reddit',icon:'r/',color:'#ff4500',bg:'#1a0c08'},
    {id:'medium',name:'Medium',icon:'M',color:'#00ab6c',bg:'#081a14'},
    {id:'substack',name:'Substack',icon:'S',color:'#ff6719',bg:'#1a1008'},
    {id:'devto',name:'Dev.to',icon:'D',color:'#0a0a0a',bg:'#141414'},
    {id:'youtube',name:'YouTube',icon:'▶',color:'#ff0000',bg:'#1a0808'},
    {id:'spotify',name:'Spotify',icon:'♫',color:'#1db954',bg:'#081a10'},
    {id:'discord',name:'Discord',icon:'D',color:'#5865f2',bg:'#0c0e1a'},
    {id:'slack',name:'Slack',icon:'#',color:'#4a154b',bg:'#140a14'},
    {id:'instagram',name:'Instagram',icon:'◻',color:'#e1306c',bg:'#1a0a14'},
    {id:'tiktok',name:'TikTok',icon:'♪',color:'#00f2ea',bg:'#081a1a'},
    {id:'stackoverflow',name:'Stack Overflow',icon:'SO',color:'#f48024',bg:'#1a1008'},
    {id:'notion',name:'Notion',icon:'N',color:'#fff',bg:'#141414'},
    {id:'producthunt',name:'Product Hunt',icon:'P',color:'#da552f',bg:'#1a0c08'},
    {id:'shop',name:'Shop',icon:'🛍',color:'#96bf48',bg:'#101a08'},
    {id:'wiki',name:'Wiki',icon:'W',color:'#fff',bg:'#141414'},
    {id:'github_twin',name:'GitHub',icon:'⌥',color:'#f0f6fc',bg:'#0d1117'},
  ];

  function fetchJ(u){return fetch(u+'?t='+Date.now()).then(function(r){if(!r.ok)throw r.status;return r.json()}).catch(function(){return null})}
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
  function timeAgo(ts){if(!ts)return'';var s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}

  function buildCard(platform, echoes, produced){
    var p=platform;
    var card=document.createElement('div');card.className='twin-card';

    var echoCount=echoes?echoes.length:0;
    var prodCount=produced?produced.length:0;

    card.innerHTML=
      '<div class="twin-header">'
        +'<div class="twin-icon" style="background:'+p.bg+';color:'+p.color+';font-weight:800">'+p.icon+'</div>'
        +'<div><div class="twin-name">'+p.name+'</div><div class="twin-handle">'+p.id+'</div></div>'
        +'<div class="twin-stats"><span><b>'+echoCount+'</b> echoes</span><span><b>'+prodCount+'</b> produced</span></div>'
      +'</div>';

    var body=document.createElement('div');body.className='twin-body';

    // Tabs
    var tabs=document.createElement('div');tabs.className='tab-bar';
    var tabEcho=document.createElement('button');tabEcho.className='tab active';tabEcho.textContent='Echoes';
    var tabProd=document.createElement('button');tabProd.className='tab';tabProd.textContent='Produced ('+prodCount+')';
    tabs.appendChild(tabEcho);tabs.appendChild(tabProd);

    var content=document.createElement('div');

    function renderEchoes(){
      if(!echoes||!echoes.length){content.innerHTML='<div class="empty">No echoes yet</div>';return}
      content.innerHTML='';
      echoes.slice(-8).reverse().forEach(function(e){
        var item=document.createElement('div');item.className='echo-item';
        item.innerHTML='<div class="echo-text">'+esc(e.text||'').substring(0,200)+'</div>'
          +'<div class="echo-meta"><span class="echo-author">'+esc(e.author_name||e.author_handle||'')+'</span>'
          +' · '+esc(e.channel||'')+' · '+timeAgo(e.utc)
          +(e.discussion_number?' · <a href="index.html#/discussions/'+e.discussion_number+'">#'+e.discussion_number+'</a>':'')
          +'</div>';
        content.appendChild(item);
      });
    }

    function renderProduced(){
      if(!produced||!produced.length){content.innerHTML='<div class="empty">No produced content yet</div>';return}
      content.innerHTML='';
      produced.slice(-5).reverse().forEach(function(pr){
        var item=document.createElement('div');item.className='produced-item';
        var title=pr.title||pr.surface_name||pr.surface||'';
        var preview=pr.content||pr.prompt_summary||pr.body||'';
        item.innerHTML='<div class="produced-badge">Frame '+(pr.frame||'?')+'</div>'
          +'<div class="produced-title">'+esc(title)+'</div>'
          +'<div class="produced-preview">'+esc(preview).substring(0,200)+'</div>';
        content.appendChild(item);
      });
    }

    tabEcho.onclick=function(){tabEcho.className='tab active';tabProd.className='tab';renderEchoes()};
    tabProd.onclick=function(){tabProd.className='tab active';tabEcho.className='tab';renderProduced()};

    body.appendChild(tabs);
    body.appendChild(content);
    card.appendChild(body);
    renderEchoes();
    return card;
  }

  // Load all twins
  var grid=document.getElementById('twins');
  var totalEchoes=0,totalProduced=0;

  var promises=PLATFORMS.map(function(p){
    return Promise.all([
      fetchJ(STATE+'/'+p.id+'.json'),
      fetchJ(STATE+'/'+p.id+'_produced.json'),
    ]).then(function(results){
      var echoData=results[0];
      var prodData=results[1];
      var echoes=echoData?(echoData.echoes||[]):[];
      var produced=prodData?(prodData.produced||[]):[];
      totalEchoes+=echoes.length;
      totalProduced+=produced.length;
      return{platform:p,echoes:echoes,produced:produced};
    });
  });

  Promise.all(promises).then(function(twins){
    // Sort by echo count desc
    twins.sort(function(a,b){return b.echoes.length-a.echoes.length});
    twins.forEach(function(t){
      grid.appendChild(buildCard(t.platform,t.echoes,t.produced));
    });
    document.getElementById('hero-stats').innerHTML=
      '<div class="stat"><b>'+PLATFORMS.length+'</b><span>Platforms</span></div>'
      +'<div class="stat"><b>'+totalEchoes+'</b><span>Echoes</span></div>'
      +'<div class="stat"><b>'+totalProduced+'</b><span>Produced</span></div>';
  });
})();
</script>
</body>
</html>
