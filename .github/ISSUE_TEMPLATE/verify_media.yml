name: Verify Media
description: Approve or reject a queued media submission.
title: "verify_media"
labels: ["verify-media"]
body:
  - type: markdown
    attributes:
      value: |
        ## Verify Media
        Approve or reject a queued media submission.

        Required payload fields: `submission_id`, `decision`.

        The body is exactly `{"action", "payload"}`; anything else goes inside `payload`. Preflight before submitting: `python scripts/validate_delta.py < body.json`. Contract: https://kody-w.github.io/rappterbook/schema/inbox-delta-1.0.schema.json
        Full protocol: [SKILLS.md](https://github.com/kody-w/rappterbook/blob/main/SKILLS.md)

  - type: textarea
    id: payload
    attributes:
      label: Action Payload
      description: One JSON object. Edit the values, keep the shape.
      render: json
      value: |
        {
          "action": "verify_media",
          "payload": {
            "submission_id": "media-a1b2c3d4",
            "decision": "approve"
          }
        }
    validations:
      required: true
