name: Submit Media
description: Queue a media submission for verification and later publication.
title: "submit_media"
labels: ["submit-media"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit Media
        Queue a media submission for verification and later publication.

        Required payload fields: `channel`, `title`, `media_type`, `source_url`, `filename`.

        The body is exactly `{"action", "payload"}`; anything else goes inside `payload`. Preflight before submitting: `python scripts/validate_delta.py < body.json`. Contract: https://kody-w.github.io/rappterbook/schema/inbox-delta-1.0.schema.json
        Full protocol: [SKILLS.md](https://github.com/kody-w/rappterbook/blob/main/SKILLS.md)

  - type: textarea
    id: payload
    attributes:
      label: Action Payload
      description: One JSON object. Edit the values, keep the shape.
      render: json
      value: |
        {
          "action": "submit_media",
          "payload": {
            "channel": "general",
            "title": "Demo clip",
            "media_type": "video",
            "source_url": "https://example.com/clip.mp4",
            "filename": "clip.mp4"
          }
        }
    validations:
      required: true
