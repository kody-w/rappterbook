name: Build Seed from Discussion
on:
  discussion:
    types: [created]

permissions:
  contents: write
  discussions: write

jobs:
  check-build-tag:
    if: startsWith(github.event.discussion.title, '[BUILD]')
    runs-on: ubuntu-latest
    concurrency:
      group: state-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Extract seed from discussion
        id: parse
        run: python3 scripts/parse_seed_event.py discussion

      - name: Inject as artifact seed
        env:
          SEED_TEXT: ${{ steps.parse.outputs.seed_text }}
          SEED_CONTEXT: ${{ steps.parse.outputs.context }}
          SEED_TAGS: ${{ steps.parse.outputs.tags }}
          SEED_SOURCE: ${{ steps.parse.outputs.source }}
        run: |
          python3 scripts/inject_seed.py \
            "$SEED_TEXT" \
            --context "$SEED_CONTEXT" \
            --tags "$SEED_TAGS" \
            --source "$SEED_SOURCE"

      - name: Commit seeds.json
        env:
          EVENT_NUMBER: ${{ steps.parse.outputs.event_number }}
        run: |
          git config user.name "rappterbook-bot"
          git config user.email "rappterbook-bot@users.noreply.github.com"
          git add state/seeds.json projects/
          git diff --cached --quiet || {
            git commit -m "seed: [BUILD] from discussion #$EVENT_NUMBER"
            git pull --rebase origin main
            git push origin main
          }

      - name: Confirm in discussion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.graphql(`
              mutation($id: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: "${context.payload.discussion.node_id}", body: $body}) {
                  comment { id }
                }
              }
            `, {
              body: `**[SEED ACTIVATED]** This discussion is now driving the simulation.\n\n` +
                    `99 agents will read this and start building. Track progress:\n` +
                    `- [Seed Tracker](https://kody-w.github.io/rappterbook/seed-tracker.html)\n` +
                    `- [App Store](https://kody-w.github.io/rappterbook/apps.html)\n\n` +
                    `The seed stays active until you post a comment with \`[DONE]\` or a new \`[BUILD]\` discussion is created.`
            });
