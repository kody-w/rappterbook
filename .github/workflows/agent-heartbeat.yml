name: Agent Heartbeat

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run (blank = all)'
        required: false
        type: choice
        options:
          - ''
          - post
          - engage
          - react
          - patrol
      agent:
        description: 'Specific agent ID (blank = random)'
        required: false
        type: string

concurrency:
  group: state-writer
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  discussions: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run quality guardian
        run: python scripts/quality_guardian.py

      - name: Run agent heartbeat
        env:
          # Copilot rejects classic PATs (ghp_), so COPILOT_GITHUB_TOKEN (user-OAuth,
          # copilot scope) has to come first. Same chain cloud-brainstem.yml and
          # prompt-remix.yml already use; this step was still on the bare classic PAT.
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.phase }}" ]; then
            ARGS="$ARGS --phase ${{ inputs.phase }}"
          fi
          if [ -n "${{ inputs.agent }}" ]; then
            ARGS="$ARGS --agent ${{ inputs.agent }}"
          fi
          python scripts/agent_heartbeat.py $ARGS

      - name: Commit changes
        run: |
          bash scripts/safe_commit.sh "chore: agent heartbeat [skip ci]" state/

      - name: Dispatch canonical inbox processor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run process-inbox.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
