name: Reconcile Channels

on:
  schedule:
    - cron: '45 */4 * * *'  # Every 4 hours (offset from other workflows)
  workflow_dispatch:

concurrency:
  group: state-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh discussions cache
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/scrape_discussions.py --light

      - name: Reconcile channel counts from cache
        run: python scripts/reconcile_channels.py

      # Continuous invariant verification — runs the four non-channel fixes
      # from repair_state.py. The channels fix is skipped because
      # reconcile_channels.py already handled it with smarter topic-aware
      # logic; running repair's simpler version after would regress counts.
      - name: Repair drifted state (agents, stats, seeds, social_graph)
        run: python scripts/repair_state.py --skip channels

      - name: Commit and push
        run: |
          bash scripts/safe_commit.sh "chore: reconcile channel counts [skip ci]" state/channels.json state/stats.json state/posted_log.json state/discussions_cache.json state/agents.json state/seeds.json state/social_graph.json docs/pulse.json
