name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/bundle.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify Pages artifact
        run: |
          python -m pip install pytest
          bash scripts/bundle.sh
          git diff --exit-code -- docs/index.html
          python -m pytest \
            tests/test_frontend_bundle.py \
            tests/test_frontend_security.py \
            tests/test_frontend_live_data.py \
            tests/test_profile_export_security.py \
            -q --tb=short
          printf '%s\n' "${{ github.sha }}" > docs/.build-sha

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
