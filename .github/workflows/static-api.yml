name: Static API

on:
  push:
    branches: [main]
    paths:
      - 'state/**'
      - 'scripts/build_static_api.py'
      - 'scripts/build_nodeinfo.py'
      - 'state/api-manifest.json'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

concurrency:
  # Deliberately NOT the shared `state-writer` group. Nine workflows sit in
  # that group, and GitHub keeps only ONE pending run per group — so a newly
  # queued run cancels the previously pending one. This job lost every race:
  # cancelled 3/3, never once completed, while every failure-based check
  # stayed green because `cancelled` is not `failure`.
  #
  # It writes only docs/api/ and the two nodeinfo snapshots
  # (.well-known/nodeinfo-2.1 and docs/.well-known/nodeinfo-2.1), none of
  # which any other workflow touches, so it does not need the state-writer
  # lock. Its own group serialises it against itself, which is all the mutual
  # exclusion it actually requires.
  group: static-api
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Refuse to publish a broken document. state/social_graph.json sat on
      # main with 590 unresolved conflict markers - 1.69 MB, publicly served,
      # CORS-open, and unparseable by every consumer. Nothing went red.
      - name: Reject conflict markers and unparseable JSON/XML
        run: python3 scripts/check_no_conflict_markers.py

      - name: Build the static API
        run: python3 scripts/build_static_api.py

      - name: Render nodeinfo from state
        run: python3 scripts/build_nodeinfo.py

      # The build is idempotent by contract (SPEC 3). If a second run differs,
      # the build is not a pure function of its input and the append-only
      # store would grow on every schedule tick forever.
      - name: Verify idempotence
        run: |
          python3 scripts/build_static_api.py
          python3 scripts/build_static_api.py --check
          python3 scripts/build_nodeinfo.py --check

      - name: Commit only real changes
        run: bash scripts/safe_commit.sh "chore(api)- rebuild static api [skip ci]" docs/api/ .well-known/nodeinfo-2.1 docs/.well-known/nodeinfo-2.1

      # Public factory board (docs/board.html reads docs/board.json). Off
      # unless the repo variable FACTORY_PROJECT (owner/number) is set. The
      # default GITHUB_TOKEN cannot read Projects v2, so it is not used: set
      # the secret FACTORY_PROJECT_TOKEN (read:project) or the exporter
      # prints "skipped: no token" and leaves board.json untouched. Only
      # public items from the allowlisted repositories (FACTORY_BOARD_REPOS,
      # default this repository) are published.
      # Runs only our own exporter -- no repository or Discussion content is
      # executed -- and commits only docs/board.json, and only when it changed.
      # continue-on-error: the board is an optional add-on; a gh outage must
      # not turn the static API run red after its own commit already landed.
      - name: Export the factory board
        if: ${{ vars.FACTORY_PROJECT != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          FACTORY_PROJECT: ${{ vars.FACTORY_PROJECT }}
          FACTORY_BOARD_REPOS: ${{ vars.FACTORY_BOARD_REPOS }}
        run: |
          python3 scripts/export_board.py
          bash scripts/safe_commit.sh "chore(board)- export factory board [skip ci]" docs/board.json
