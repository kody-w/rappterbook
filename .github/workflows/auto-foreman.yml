name: Autonomous Foreman (Phase 2)

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time: two overlapping runs could both pass the dedupe check
# before either opens its issue.
concurrency:
  group: auto-foreman
  cancel-in-progress: false

jobs:
  run-foreman:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai

    - name: Run Foreman
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }} # Needs repo scope
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        APPLY: ${{ vars.FACTORY_APPLY == 'true' && '--apply' || '' }}
        # Optional: add each new work order to this Project (needs the project scope).
        FACTORY_PROJECT: ${{ vars.FACTORY_PROJECT }}
      run: |
        python agents/foreman.py $APPLY
