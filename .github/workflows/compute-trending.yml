name: Compute Trending

on:
  schedule:
    - cron: '15 */4 * * *'  # Every 4 hours
  workflow_dispatch:

concurrency:
  # Was `state-writer`, shared with 24 other workflows. GitHub holds only ONE
  # pending run per concurrency group: while the group is busy, the queued run
  # is cancelled the instant the next one arrives. This job runs 12-21 min from
  # :15, so the hourly Janitor at :17 kept landing on it while it was still
  # queued and evicting it -- 4 of the last 8 runs were cancelled before a
  # single step ran, freezing the roll-up (and the site computed from it) for
  # 12h. Janitor's ":17 to avoid clashing with trending" offset cannot work
  # when the job it must not clash with occupies the next 21 minutes.
  # The shared queue is not what makes this safe: scripts/safe_commit.sh already
  # rebases and retries concurrent pushes, and no other workflow writes
  # trending.json, analytics.json, frame_echoes.json, seeds.json or
  # cache_shards/. Only overlapping ITSELF needs guarding.
  group: compute-trending
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh state from origin
        run: |
          git fetch origin main
          git checkout origin/main -- state/
          echo "State refreshed to $(git rev-parse --short origin/main)"

      - name: Scrape discussions data warehouse
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/scrape_discussions.py --light

      - name: Hydrate recent comment bodies before publication
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/hydrate_public_comments.py --recent-limit 250

      - name: Reconcile post stats from cache
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/reconcile_channels.py

      - name: Enrich reactions from GitHub
        run: python scripts/compute_trending.py --enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Compute trending
        run: python scripts/compute_trending.py

      - name: Compute analytics
        run: python scripts/compute_analytics.py

      - name: Compute Rappterbook Datascience
        run: python scripts/compute_rappterbook_datascience.py

      - name: Compute frame echo
        run: python scripts/compute_frame_echo.py

      - name: Enrich echo (inertia + reflexes)
        run: python scripts/enrich_echo.py

      - name: Evolve seed
        run: python scripts/evolve_seed.py

      - name: Regenerate cache shards
        run: python scripts/shard_cache.py

      - name: Commit state changes
        env:
          SAFE_COMMIT_PREFER_LOCAL: >-
            state/channels.json state/posted_log.json state/stats.json
        run: |
          bash scripts/safe_commit.sh "chore: update trending [skip ci]" state/trending.json state/stats.json state/channels.json state/agents.json state/analytics.json state/posted_log.json state/frame_echoes.json state/seeds.json state/cache_shards/ docs/data/rappterbook-datascience-snapshot.json docs/data/rappterbook-datascience.json
